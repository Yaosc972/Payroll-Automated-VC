name: Overseas Labor CI

on:
  pull_request:
    paths:
      - ".github/workflows/overseas-labor-ci.yml"
      - ".env.example"
      - ".gitignore"
      - ".vercelignore"
      - "requirements.txt"
      - "vercel.json"
      - "api/index.py"
      - "bonus_platform/app.py"
      - "bonus_platform/auth.py"
      - "bonus_platform/config.py"
      - "bonus_platform/engine/admin_store.py"
      - "bonus_platform/engine/labor/**"
      - "bonus_platform/worker/**"
      - "bonus_platform/static/index.html"
      - "bonus_platform/static/login.html"
      - "bonus_platform/static/login.js"
      - "bonus_platform/static/overseas-labor.html"
      - "bonus_platform/static/overseas-labor.js"
      - "bonus_platform/static/permission-guard.js"
      - "bonus_platform/static/styles.css"
      - "bonus_platform/static/labor-operations.*"
      - "bonus_platform/static/assets/bonus-logo-dark.png"
      - "bonus_platform/static/assets/bonus-logo-header-blue.png"
      - "bonus_platform/static/assets/overseas-labor-logo-2026.png"
      - "bonus_platform/static/assets/workbench-logo-2026.png"
      - "bonus_platform/static/assets/workbench-sigma-mark.png"
      - "data/supplier_profiles/**"
      - "labor-worker-desktop/**"
      - "docs/labor_*"
      - "docs/labor_*/**"
      - "docs/sql/*.sql"
      - "docs/superpowers/plans/*overseas-labor*.md"
      - "docs/superpowers/specs/*overseas-labor*.md"
      - "tools/labor_*"
      - "tests/test_labor*"
      - "tests/test_personal_labor_worker.py"
      - "tests/test_static_branding.py"
      - "tests/conftest.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/overseas-labor-ci.yml"
      - ".env.example"
      - ".gitignore"
      - ".vercelignore"
      - "requirements.txt"
      - "vercel.json"
      - "api/index.py"
      - "bonus_platform/app.py"
      - "bonus_platform/auth.py"
      - "bonus_platform/config.py"
      - "bonus_platform/engine/admin_store.py"
      - "bonus_platform/engine/labor/**"
      - "bonus_platform/worker/**"
      - "bonus_platform/static/index.html"
      - "bonus_platform/static/login.html"
      - "bonus_platform/static/login.js"
      - "bonus_platform/static/overseas-labor.html"
      - "bonus_platform/static/overseas-labor.js"
      - "bonus_platform/static/permission-guard.js"
      - "bonus_platform/static/styles.css"
      - "bonus_platform/static/labor-operations.*"
      - "bonus_platform/static/assets/bonus-logo-dark.png"
      - "bonus_platform/static/assets/bonus-logo-header-blue.png"
      - "bonus_platform/static/assets/overseas-labor-logo-2026.png"
      - "bonus_platform/static/assets/workbench-logo-2026.png"
      - "bonus_platform/static/assets/workbench-sigma-mark.png"
      - "data/supplier_profiles/**"
      - "labor-worker-desktop/**"
      - "docs/labor_*"
      - "docs/labor_*/**"
      - "docs/sql/*.sql"
      - "docs/superpowers/plans/*overseas-labor*.md"
      - "docs/superpowers/specs/*overseas-labor*.md"
      - "tools/labor_*"
      - "tests/test_labor*"
      - "tests/test_personal_labor_worker.py"
      - "tests/test_static_branding.py"
      - "tests/conftest.py"

permissions:
  contents: read

jobs:
  scope:
    name: Enforce overseas labor candidate scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_base="$BASE_SHA...$HEAD_SHA"
            changed_paths="$(git -c core.quotepath=false diff --name-only "$diff_base")"
            git diff --check "$diff_base"
          else
            if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
            changed_paths="$(git -c core.quotepath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
          printf '%s\n' "$changed_paths"
          worker_runtime_paths="$(printf '%s\n' "$changed_paths" | grep -E '^(bonus_platform/worker/|labor-worker-desktop/(main\.js|preload\.js|worker_entry\.py|pyinstaller-worker\.spec|requirements-worker\.txt|lib/|renderer/))' || true)"
          if [ -n "$worker_runtime_paths" ]; then
            base_package="$(git show "$BASE_SHA:labor-worker-desktop/package.json" 2>/dev/null || true)"
            base_version="$(printf '%s' "$base_package" | python3 -c 'import json,sys; payload=sys.stdin.read(); print(json.loads(payload).get("version", "") if payload else "")')"
            head_version="$(python3 -c 'import json; print(json.load(open("labor-worker-desktop/package.json", encoding="utf-8"))["version"])')"
            if [ -n "$base_version" ] && [ "$base_version" = "$head_version" ]; then
              printf 'Worker runtime changed without a version bump from %s:\n%s\n' "$head_version" "$worker_runtime_paths" >&2
              exit 1
            fi
          fi
          forbidden_paths="$(printf '%s\n' "$changed_paths" | grep -E '^(desktop/|bonus_platform/engine/fbu_performance/|\.playwright-cli/|\.superpowers/|output/|tmp/|labor-worker-desktop/(node_modules|worker-build|worker-dist|release|dist)/)' || true)"
          if [ -n "$forbidden_paths" ]; then
            printf 'Overseas Labor candidate contains forbidden paths:\n%s\n' "$forbidden_paths" >&2
            exit 1
          fi
          printf '%s\n' "$changed_paths" | python3 tools/labor_candidate_material_guard.py .
          allowed_paths='^(\.github/workflows/overseas-labor-ci\.yml|\.env\.example|\.gitignore|\.vercelignore|requirements\.txt|vercel\.json|api/index\.py|bonus_platform/(app|auth|config)\.py|bonus_platform/engine/admin_store\.py|bonus_platform/engine/labor/.*|bonus_platform/worker/.*|bonus_platform/static/(index\.html|login\.(html|js)|permission-guard\.js|styles\.css|overseas-labor\.(html|js)|labor-operations\.(html|css|js)|assets/(workbench-sigma-mark|workbench-logo-2026|overseas-labor-logo-2026|bonus-logo-dark|bonus-logo-header-blue)\.png)|data/supplier_profiles/.*|labor-worker-desktop/.*|docs/(labor_[^/]+|labor_[^/]+/.*|sql/[^/]+\.sql|superpowers/(plans|specs)/[^/]*overseas-labor[^/]*\.md)|tools/labor_[^/]+|tests/(conftest\.py|test_labor[^/]*\.py|test_personal_labor_worker\.py|test_static_branding\.py))$'
          unexpected_paths="$(printf '%s\n' "$changed_paths" | grep -Ev "$allowed_paths" || true)"
          if [ -n "$unexpected_paths" ]; then
            printf 'Overseas Labor candidate contains paths outside the reviewed allowlist:\n%s\n' "$unexpected_paths" >&2
            exit 1
          fi

  python:
    name: Python labor regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pillow
      - name: Compile labor runtime
        run: python -m compileall -q bonus_platform/engine/labor bonus_platform/worker
      - name: Run labor tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_ADDOPTS: "-p no:cacheprovider"
        run: python -m pytest -q tests/test_labor*.py tests/test_personal_labor_worker.py tests/test_static_branding.py

  worker:
    name: Standalone Worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labor-worker-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: labor-worker-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check browser scripts
        run: |
          node --check ../bonus_platform/static/overseas-labor.js
          node --check ../bonus_platform/static/labor-operations.js
      - run: npm test

  worker_platform:
    name: Worker platform check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: labor-worker-desktop/package-lock.json
      - name: Install focused Worker dependencies
        run: python -m pip install -r requirements.txt pytest pillow
      - name: Install desktop dependencies
        working-directory: labor-worker-desktop
        run: npm ci
      - name: Run cross-platform Worker tests
        run: python -m pytest -q tests/test_personal_labor_worker.py tests/test_labor_worker_package_boundary.py
      - name: Run Electron shell tests
        working-directory: labor-worker-desktop
        run: |
          npm run check
          npm test

  gate:
    name: Overseas labor final gate
    if: always()
    needs: [scope, python, worker, worker_platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          WORKER_PLATFORM_RESULT: ${{ needs.worker_platform.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$WORKER_RESULT" = "success"
          test "$WORKER_PLATFORM_RESULT" = "success"
          test "$SCOPE_RESULT" = "success"
