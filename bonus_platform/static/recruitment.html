        <button hidden id="flowPrimary" class="rd-button rd-primary" type="button"><svg class="rd-icon" aria-hidden="true"><use href="#icon-plus"/></svg>新建核算</button>

        <div id="flowUtilityActions" hidden>

          <button id="flowBatch" type="button">批量修改</button>

        <button id="draftUploadButton" class="rd-button" type="button"><svg class="rd-icon" aria-hidden="true"><use href="#icon-plus"/></svg>添加资料</button>
        <a id="draftExport" class="rd-button rd-primary" aria-disabled="true"><svg class="rd-icon" aria-hidden="true"><use href="#icon-down"/></svg>导出核算结果</a>
        <input id="draftUpload" class="rd-sr-only" type="file" accept=".xlsx,.xlsm,.xls,.pdf,.png,.jpg,.jpeg" multiple tabindex="-1" />

      <div class="rd-drop-overlay" aria-hidden="true">放开以添加资料</div>
