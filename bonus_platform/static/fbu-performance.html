<!doctype html>
<html lang="zh-CN" data-module-id="fbu" data-server-guarded="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FBU美洲绩效奖金核算 · 西格玛工作台</title>
    <link rel="icon" type="image/png" href="assets/bonus-logo-dark.png" />
    <link rel="stylesheet" href="styles.css?v=31" />
    <script src="permission-guard.js?v=9"></script>
    <style>
      :root {
        --primary: #635BFF;
        --primary-deep: #4F46E5;
        --primary-ink: #312E81;
        --success: #10B981;
        --danger: #EF4444;
        --warning: #F59E0B;
        --bg-main: #F4F6F9;
        --bg-card: #FFFFFF;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --border: #E2E8F0;
        --border-strong: #CBD5E1;
        --mono: "SF Mono", "Roboto Mono", ui-monospace, monospace;
        --sidebar-bg: rgba(15, 23, 42, 0.88);
        --sidebar-text: #CBD5E1;
        --sidebar-active: #FFFFFF;
        --focus-ring: 0 0 0 4px rgba(99, 91, 255, 0.14);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
      }

      /* ═══ Layout ═══ */
      .app-layout {
        display: flex;
        min-height: 100vh;
      }

      /* ═══ Sidebar ═══ */
      .sidebar {
        width: 220px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        color: white;
      }

      .sidebar-logo img {
        width: 34px;
        height: 34px;
      }

      .sidebar-logo-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1;
      }

      .sidebar-logo-sigma,
      .sidebar-logo-brand {
        font-size: 14px;
        font-weight: 600;
        color: white;
      }

      .sidebar-logo-sub {
        font-size: 11px;
        color: var(--sidebar-text);
      }

      .sidebar-nav {
        flex: 1;
        padding: 16px 0;
      }

      .nav-section {
        padding: 0 12px;
        margin-bottom: 8px;
      }

      .nav-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--sidebar-text);
        padding: 8px 12px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
        color: var(--sidebar-text);
        text-decoration: none;
      }

      .nav-item:hover {
        background: rgba(255,255,255,0.1);
        color: white;
      }

      .nav-item.active {
        background: var(--primary);
        color: white;
      }

      .nav-item-icon {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-item-text {
        font-size: 14px;
      }

      /* ═══ Main Content ═══ */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* ═══ Top Bar ═══ */
      .top-bar {
        position: relative;
        z-index: 40;
        height: 60px;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }

      .top-bar-left {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .top-brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-primary);
        text-decoration: none;
        flex: 0 0 auto;
      }

      .top-brand-mark {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      .top-brand-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1;
      }

      .top-brand-en {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .top-brand-cn {
        color: var(--text-primary);
        font-size: 17px;
        font-weight: 760;
      }

      .top-module-divider {
        width: 1px;
        height: 34px;
        background: var(--border);
        flex: 0 0 auto;
      }

      .top-module-copy {
        min-width: 0;
      }

      .module-eyebrow {
        display: block;
        margin-bottom: 3px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
      }

      .top-bar-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .top-bar-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
      }

      .top-bar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* ═══ Buttons ═══ */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        border: none;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: #005BB5;
      }

      .btn-secondary {
        background: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--bg-main);
      }

      .btn-quiet {
        background: #fff;
        color: #475569;
      }

      .btn-danger {
        background: var(--danger);
        color: white;
      }

      .btn-danger:hover {
        background: #DC2626;
      }

      .btn-sm {
        padding: 6px 12px;
        font-size: 13px;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ═══ Content Area ═══ */
      .content-area {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
      }

      /* ═══ KPI Cards ═══ */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
      }

      .kpi-card {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 20px;
        box-shadow: none;
      }

      .kpi-card-label {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .kpi-card-value {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .kpi-card-sub {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
      }

      .kpi-card.success .kpi-card-value { color: var(--success); }
      .kpi-card.danger .kpi-card-value { color: var(--danger); }
      .kpi-card.warning .kpi-card-value { color: var(--warning); }

      /* ═══ Panel ═══ */
      .panel {
        background: var(--bg-card);
        border-radius: 12px;
        box-shadow: none;
        margin-bottom: 24px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .panel-body {
        padding: 20px;
      }

      /* ═══ Data Table ═══ */
      .data-table-container {
        overflow-x: auto;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .data-table th {
        background: #F1F5F9;
        padding: 12px 16px;
        text-align: left;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }

      .data-table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      .data-table tr:hover {
        background: #F8FAFC;
      }

      .data-table tr.row-danger {
        background: #FEF2F2;
      }

      .data-table tr.row-danger:hover {
        background: #FEE2E2;
      }

      /* ═══ Status Badge ═══ */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
      }

      .status-badge.success {
        background: #D1FAE5;
        color: #065F46;
      }

      .status-badge.danger {
        background: #FEE2E2;
        color: #991B1B;
      }

      .status-badge.warning {
        background: #FEF3C7;
        color: #92400E;
      }

      /* ═══ Upload Zone ═══ */
      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .upload-zone:hover {
        border-color: var(--primary);
        background: rgba(0,113,227,0.02);
      }

      .upload-zone.is-dragover,
      .upload-zone.has-file {
        border-color: var(--primary-deep);
        background: rgba(47, 84, 235, 0.04);
      }

      .upload-zone[hidden],
      .upload-result-panel[hidden],
      .upload-context-field[hidden] {
        display: none;
      }

      .upload-zone-icon {
        margin-bottom: 12px;
      }

      .upload-zone-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .upload-zone-sub {
        font-size: 14px;
        color: var(--text-secondary);
      }

      .upload-context-field {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        background: #F8FAFC;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .upload-context-label {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
      }

      .upload-context-sub {
        margin-top: 2px;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .upload-modal {
        width: 560px;
      }

      .performance-supplement-modal {
        width: min(720px, calc(100vw - 32px));
      }

      .performance-supplement-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .performance-supplement-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .performance-supplement-field.full {
        grid-column: 1 / -1;
      }

      .performance-supplement-field label {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
      }

      .performance-supplement-field input,
      .performance-supplement-field select,
      .performance-supplement-field textarea {
        min-height: 40px;
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
        color: var(--text-primary);
        font: inherit;
        padding: 8px 10px;
        outline: none;
      }

      .performance-supplement-field textarea {
        min-height: 72px;
        resize: vertical;
      }

      .performance-supplement-field input:focus,
      .performance-supplement-field select:focus,
      .performance-supplement-field textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      @media (max-width: 640px) {
        .performance-supplement-grid {
          grid-template-columns: 1fr;
        }
      }

      .upload-result-panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .upload-result-header {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .upload-result-icon {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #D1FAE5;
        color: #047857;
      }

      .upload-result-title {
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 750;
        line-height: 1.4;
      }

      .upload-result-sub {
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.6;
      }

      .upload-result-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .upload-result-stat {
        min-width: 0;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .upload-result-stat.warning {
        border-color: #FDE68A;
        background: #FFFBEB;
      }

      .upload-result-stat.success {
        border-color: #BBF7D0;
        background: #F0FDF4;
      }

      .upload-result-stat.danger {
        border-color: #FECACA;
        background: #FEF2F2;
      }

      .upload-result-label {
        display: block;
        margin-bottom: 4px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 650;
      }

      .upload-result-value {
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .upload-result-file {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #F8FAFC;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.5;
      }

      .upload-result-file strong {
        color: var(--text-primary);
        font-weight: 700;
      }

      /* ═══ Modal ═══ */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.48);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal {
        background: var(--bg-card);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        width: 480px;
        max-width: 90%;
        box-shadow: none;
        transform: translateY(-12px) scale(0.98);
        transition: transform 0.22s ease;
        overflow: hidden;
      }

      .modal-overlay.active .modal {
        transform: translateY(0) scale(1);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
      }

      .modal-title {
        font-size: 18px;
        font-weight: 600;
      }

      .modal-close {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
      }

      .modal-close:hover {
        background: var(--bg-main);
      }

      .modal-body {
        padding: 24px;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: #F8FAFC;
      }

      .app-dialog {
        width: 520px;
      }

      .app-dialog-accent {
        display: none;
        height: 3px;
        background: var(--primary-deep);
      }

      .app-dialog.warning .app-dialog-accent,
      .app-dialog.danger .app-dialog-accent { display: block; }

      .app-dialog.warning .app-dialog-accent { background: var(--warning); }
      .app-dialog.danger .app-dialog-accent { background: var(--danger); }

      .app-dialog-message {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 18px;
      }

      .app-dialog-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .app-dialog-field[hidden] {
        display: none;
      }

      .app-dialog-field label {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
      }

      .app-dialog-field input {
        height: 42px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        outline: none;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .app-dialog-field input:focus {
        border-color: var(--primary-deep);
        box-shadow: 0 0 0 3px rgba(47, 84, 235, 0.10);
      }

      .app-dialog-field input[readonly] {
        background: #F8FAFC;
        cursor: default;
      }

      .app-dialog-month-picker {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 2px;
      }

      .app-dialog-month-picker[hidden] {
        display: none;
      }

      .month-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #F8FAFC;
      }

      .month-picker-year {
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .month-picker-nav {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--text-secondary);
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
      }

      .month-picker-nav:hover {
        border-color: var(--primary);
        color: var(--primary-deep);
        background: rgba(24, 144, 255, 0.06);
      }

      .month-picker-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .month-picker-option {
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--text-secondary);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      }

      .month-picker-option:hover {
        border-color: var(--primary);
        color: var(--primary-deep);
        background: rgba(24, 144, 255, 0.06);
      }

      .month-picker-option.selected {
        border-color: var(--primary-deep);
        background: var(--primary-deep);
        color: #FFFFFF;
        box-shadow: none;
      }

      .app-dialog-help {
        color: var(--text-secondary);
        font-size: 12px;
      }

      .app-dialog-error {
        color: var(--danger);
        font-size: 12px;
        min-height: 16px;
      }

      .btn-warning {
        background: var(--warning);
        color: #111827;
      }

      .btn-warning:hover {
        background: #D97706;
        color: white;
      }

      /* ═══ Steps Indicator ═══ */
      .steps-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
      }

      .step-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .step-number {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--border);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
      }

      .step-item.active .step-number {
        background: var(--primary);
        color: white;
      }

      .step-item.completed .step-number {
        background: var(--success);
        color: white;
      }

      .step-text {
        font-size: 14px;
        color: var(--text-secondary);
      }

      .step-item.active .step-text {
        color: var(--text-primary);
        font-weight: 600;
      }

      .step-connector {
        width: 40px;
        height: 2px;
        background: var(--border);
      }

      .step-item.completed + .step-connector {
        background: var(--success);
      }

      .activity-stepper {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 20px;
      }

      .activity-step {
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--text-primary);
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 4px;
      }

      .activity-step.active {
        border-color: var(--primary);
        background: rgba(37, 99, 235, 0.08);
        box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.12);
      }

      .activity-step-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #EEF2FF;
        color: var(--primary-ink);
        font-size: 11px;
        font-weight: 800;
      }

      .activity-step-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
      }

      .activity-step-status {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: #F8FAFC;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 700;
      }

      .activity-step-status.warning {
        background: #FFF8E8;
        color: #7A4F00;
      }

      .activity-step-status.success {
        background: #F3FBF5;
        color: #286145;
      }

      /* ═══ Summary Stats ═══ */
      .summary-stats {
        display: flex;
        gap: 24px;
        padding: 16px 0;
        border-top: 1px solid var(--border);
        margin-top: 16px;
      }

      .summary-stat {
        display: flex;
        flex-direction: column;
      }

      .summary-stat-label {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .summary-stat-value {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      /* ═══ Import Workbench ═══ */
      .import-workbench {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .import-result-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid #BBF7D0;
        border-radius: 8px;
        background: #F0FDF4;
        color: #166534;
        font-size: 13px;
      }

      .import-result-note strong {
        color: #14532D;
      }

      .import-result-note.warning {
        border-color: #FDE68A;
        background: #FFFBEB;
        color: #92400E;
      }

      .import-result-note.warning strong {
        color: #78350F;
      }

      .import-result-context {
        display: block;
        margin-top: 4px;
        line-height: 1.5;
      }

      .import-summary-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(156px, 1fr));
        gap: 12px;
      }

      .import-summary-item {
        min-width: 0;
        padding: 14px 16px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .import-summary-label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
      }

      .import-summary-value {
        color: var(--text-primary);
        font-size: 20px;
        font-weight: 750;
        line-height: 1.2;
      }

      .import-summary-value.mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .import-summary-item.success .import-summary-value { color: var(--success); }
      .import-summary-item.warning .import-summary-value { color: var(--warning); }
      .import-summary-item.danger .import-summary-value { color: var(--danger); }

      .import-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        padding: 16px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .import-toolbar-heading {
        margin-bottom: 12px;
      }

      .import-toolbar-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .import-toolbar-sub {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .import-filter-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      .import-toolbar-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .import-table-card {
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        overflow: hidden;
        background: #FFFFFF;
      }

      .import-table-card .data-table-container {
        max-height: calc(100vh - 430px);
        overflow: auto;
      }

      .import-table-card .data-table th {
        position: sticky;
        top: 0;
        z-index: 2;
      }

      /* ═══ Toasts ═══ */
      .toast-region {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1200;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      .toast {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) 28px;
        gap: 10px;
        align-items: start;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.26);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: none;
        pointer-events: auto;
        animation: toastIn 0.22s ease;
      }

      .toast.is-leaving {
        animation: toastOut 0.18s ease forwards;
      }

      .toast-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
      }

      .toast-title {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 760;
        line-height: 1.4;
      }

      .toast-message {
        margin-top: 2px;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.5;
      }

      .toast-close {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .toast-close:hover {
        background: #F1F5F9;
        color: var(--text-primary);
      }

      .toast-success .toast-icon {
        background: #D1FAE5;
        color: #047857;
      }

      .toast-error .toast-icon {
        background: #FEE2E2;
        color: #B91C1C;
      }

      .toast-warning .toast-icon {
        background: #FEF3C7;
        color: #B45309;
      }

      .toast-info .toast-icon {
        background: #DBEAFE;
        color: #1D4ED8;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateY(-6px);
        }
      }

      /* ═══ Results Workbench ═══ */
      .result-kpi-grid {
        grid-template-columns: 1.1fr 1.5fr 1.1fr 1fr;
        gap: 16px;
      }

      .result-kpi-grid .kpi-card {
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        box-shadow: none;
        position: relative;
        overflow: hidden;
      }

      .result-kpi-grid .kpi-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--primary-deep);
      }

      .result-kpi-grid .kpi-card.success::before { background: var(--success); }
      .result-kpi-grid .kpi-card.warning::before { background: var(--warning); }

      .result-kpi-grid .kpi-card-value {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: 0;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .result-panel {
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        box-shadow: none;
        overflow: hidden;
      }

      .result-panel .panel-body {
        padding: 0;
      }

      .results-workbench {
        background: #FFFFFF;
      }

      .result-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: end;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: #FFFFFF;
      }

      .result-toolbar-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 12px;
      }

      .result-filter-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      .filter-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .filter-field label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .filter-field input,
      .filter-field select {
        height: 36px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--text-primary);
        font-size: 13px;
        outline: none;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .filter-field select {
        cursor: pointer;
      }

      .filter-field input:focus,
      .filter-field select:focus {
        border-color: var(--primary-deep);
        box-shadow: 0 0 0 3px rgba(47, 84, 235, 0.10);
      }

      .quality-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        margin: 2px 4px 2px 0;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #FFFDF7;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 650;
        line-height: 1.2;
        white-space: nowrap;
      }

      .quality-pill.success {
        border-color: #B7DEC8;
        background: #F3FBF5;
        color: #286145;
      }

      .quality-pill.warning {
        border-color: #EBD5A1;
        background: #FFF8E8;
        color: #7A4F00;
      }

      .quality-pill.danger {
        border-color: #F2B6B2;
        background: #FFF1EF;
        color: #9D332C;
      }

      .quality-pill.neutral {
        border-color: #D9D0C4;
        background: #F8F2E8;
        color: #554A3F;
      }

      .result-toolbar-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .bonus-table-card {
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .bonus-table-shell {
        overflow: auto;
        max-height: calc(100vh - 360px);
        min-height: 360px;
        background: #FFFFFF;
      }

      .bonus-table {
        min-width: 1656px;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        font-size: 13px;
      }

      .bonus-table th,
      .bonus-table td {
        border-bottom: 1px solid var(--border);
        padding: 12px 14px;
        vertical-align: middle;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: #FFFFFF;
      }

      .bonus-table thead th {
        position: sticky;
        top: 0;
        z-index: 4;
        height: 42px;
        background: #F5F7FA;
        color: #526173;
        font-size: 12px;
        font-weight: 700;
        border-bottom: 1px solid var(--border-strong);
      }

      .bonus-table tbody tr:nth-child(even) td {
        background: #FAFCFF;
      }

      .bonus-table tbody tr:hover td {
        background: #EEF6FF;
      }

      .bonus-table tbody tr.has-exception td {
        background: #FFF7F7;
      }

      .bonus-table tbody tr.has-exception:hover td {
        background: #FFEDED;
      }

      .bonus-table .sticky-id {
        position: sticky;
        left: 0;
        z-index: 3;
        width: 128px;
        min-width: 128px;
        box-shadow: 1px 0 0 var(--border);
      }

      .bonus-table .sticky-name {
        position: sticky;
        left: 128px;
        z-index: 3;
        width: 140px;
        min-width: 140px;
        box-shadow: 1px 0 0 var(--border-strong);
      }

      .bonus-table thead .sticky-id,
      .bonus-table thead .sticky-name {
        z-index: 6;
        background: #EEF3FA;
      }

      .employee-id,
      .amount-cell,
      .metric-cell,
      .bonus-value {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .employee-id {
        color: #2B3A55;
        font-weight: 650;
      }

      .amount-cell,
      .metric-cell {
        color: #334155;
        text-align: right;
      }

      .bonus-value {
        color: var(--primary-ink);
        font-size: 14px;
        font-weight: 800;
      }

      .muted-cell {
        color: var(--text-secondary);
      }

      .job-pill {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: #EEF2FF;
        color: #3730A3;
        font-size: 12px;
        font-weight: 700;
      }

      .job-pill.functional {
        background: #ECFDF5;
        color: #047857;
      }

      .job-pill.district {
        background: #FFF7ED;
        color: #C2410C;
      }

      .exception-chip {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: #FEE2E2;
        color: #B91C1C;
        font-size: 12px;
        font-weight: 700;
        cursor: help;
      }

      .detail-btn {
        justify-content: center;
        width: 72px;
        padding: 6px 10px;
      }

      .table-empty-row td {
        height: 120px;
        color: var(--text-secondary);
        text-align: center;
        font-weight: 650;
      }

      .table-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        background: #F8FAFC;
      }

      .table-pagination-summary {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }

      .table-pagination-summary strong {
        color: var(--text-primary);
        font-family: var(--mono);
        font-weight: 780;
      }

      .table-pagination-controls,
      .table-pagination-pages,
      .page-size-select-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pagination-btn {
        min-width: 34px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      }

      .pagination-btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
        background: #F8FAFF;
      }

      .pagination-btn.active {
        border-color: transparent;
        background: var(--primary);
        color: #FFFFFF;
        box-shadow: none;
      }

      .pagination-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .table-pagination-ellipsis {
        color: var(--text-secondary);
        font-family: var(--mono);
        font-weight: 700;
      }

      .page-size-select-wrap {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }

      .page-size-select {
        min-width: 74px;
        height: 30px;
        padding: 0 28px 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #64748B 50%),
          linear-gradient(135deg, #64748B 50%, transparent 50%);
        background-position: calc(100% - 15px) 12px, calc(100% - 10px) 12px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .page-size-select:hover {
        border-color: var(--primary);
      }

      .result-summary-bar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: #F8FAFC;
      }

      .result-summary-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .result-summary-item span:first-child {
        color: var(--text-secondary);
        font-size: 12px;
      }

      .result-summary-item span:last-child {
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .final-result-groups {
        display: grid;
        gap: 12px;
        padding-top: 12px;
      }

      .final-result-slices {
        display: flex;
        gap: 8px;
        padding: 12px 0;
        overflow-x: auto;
      }

      .final-result-slice {
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--text-secondary);
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
      }

      .final-result-slice:hover {
        border-color: #9DB7F5;
        background: #F8FAFF;
      }

      .final-result-slice.active {
        border-color: var(--primary);
        background: #EFF6FF;
        color: var(--primary);
      }

      .final-result-slice span {
        font-size: 13px;
        font-weight: 850;
      }

      .final-result-slice strong,
      .final-result-slice em {
        color: inherit;
        font-family: var(--mono);
        font-size: 12px;
        font-style: normal;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .final-result-group {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .final-result-group-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: #F8FAFC;
      }

      .final-result-group-head h4 {
        margin: 0;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 850;
      }

      .final-result-group-head span {
        color: var(--text-secondary);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 750;
      }

      .final-result-table .highlight-base {
        background: #FEE2E2;
        color: #B91C1C;
        font-weight: 850;
      }

      .final-result-explanation-modal {
        width: min(720px, calc(100vw - 40px));
      }

      .final-result-explanation-modal .modal-body {
        padding: 14px 18px 18px;
      }

      .result-explanation-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .result-explanation-head div {
        display: grid;
        gap: 4px;
      }

      .result-explanation-head strong {
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 850;
      }

      .result-explanation-head span {
        color: var(--text-secondary);
        font-size: 12px;
      }

      .result-explanation-head em {
        padding: 3px 8px;
        border: 1px solid #FCA5A5;
        border-radius: 5px;
        background: #FEF2F2;
        color: #B91C1C;
        font-size: 12px;
        font-style: normal;
        font-weight: 850;
      }

      .result-explanation-formula {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #DBEAFE;
        border-radius: 6px;
        background: #F8FAFF;
      }

      .result-explanation-formula span {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 750;
      }

      .result-explanation-formula strong {
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 850;
      }

      .result-explanation-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .result-explanation-field {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        min-height: 76px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #FFFFFF;
      }

      .result-explanation-field div {
        display: grid;
        gap: 5px;
      }

      .result-explanation-field strong {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 850;
      }

      .result-explanation-field span {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.45;
      }

      .result-explanation-field em {
        align-self: start;
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 13px;
        font-style: normal;
        font-weight: 850;
        white-space: nowrap;
      }

      .result-explanation-section {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .result-explanation-section h4 {
        margin: 0 0 8px;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 850;
      }

      .result-explanation-section p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 1100px) {
        .import-summary-strip,
        .import-filter-grid {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }

        .import-toolbar {
          grid-template-columns: 1fr;
        }

        .import-toolbar-actions {
          justify-content: flex-start;
        }

        .result-kpi-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .result-toolbar {
          grid-template-columns: 1fr;
        }

        .result-toolbar-actions {
          justify-content: flex-start;
        }

        .result-filter-grid {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
      }

      @media (max-width: 720px) {
        .import-summary-strip,
        .import-filter-grid,
        .result-kpi-grid,
        .result-filter-grid {
          grid-template-columns: 1fr;
        }

        .import-table-card .data-table-container,
        .bonus-table-shell {
          max-height: none;
        }
      }

      /* ═══ Empty State ═══ */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
      }

      .empty-state-icon {
        margin-bottom: 16px;
      }

      .empty-state-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .empty-state-sub {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 24px;
      }

      /* ═══ Calculation Chain ═══ */
      .calc-chain {
        background: #F8FAFC;
        border-radius: 8px;
        padding: 16px;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
      }

      .calc-chain-title {
        font-weight: 600;
        margin-bottom: 8px;
      }

      .calc-chain-item {
        padding-left: 16px;
      }

      .calc-chain-result {
        font-weight: 600;
        color: var(--primary);
      }

      .module-grid {
        display: grid;
        grid-template-columns: minmax(280px, 1.35fr) repeat(2, minmax(180px, 0.6fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      .module-panel,
      .panel.module-table-panel {
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: none;
      }

      .module-panel {
        min-height: 132px;
        padding: 22px 24px;
      }

      .module-panel-primary {
        background: #FFFCF5;
      }

      .module-panel-label {
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .module-panel-title {
        color: var(--text-primary);
        font-size: 30px;
        font-weight: 780;
        line-height: 1.1;
      }

      .module-panel-meta {
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.5;
        margin-top: 12px;
      }

      .foundation-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.75fr);
        gap: 20px;
      }

      .module-section-title {
        color: var(--text-primary);
        font-size: 15px;
        font-weight: 780;
        margin-bottom: 14px;
      }

      .module-description {
        color: var(--text-secondary);
        line-height: 1.7;
        margin-bottom: 18px;
        max-width: 760px;
      }

      .meta-list {
        display: grid;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        overflow: hidden;
      }

      .meta-row {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        min-height: 48px;
        border-bottom: 1px solid rgba(226, 232, 240, 0.82);
      }

      .meta-row:last-child {
        border-bottom: 0;
      }

      .meta-label,
      .meta-value {
        display: flex;
        align-items: center;
        padding: 12px 14px;
      }

      .meta-label {
        color: var(--text-secondary);
        background: rgba(248, 250, 252, 0.82);
        font-weight: 700;
      }

      .meta-value {
        color: var(--text-primary);
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .module-action-list {
        display: grid;
        gap: 10px;
      }

      .module-action-card {
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        padding: 14px;
        background: #FFFFFF;
      }

      .module-action-card strong {
        display: block;
        color: var(--text-primary);
        font-size: 14px;
        margin-bottom: 6px;
      }

      .module-action-card span {
        color: var(--text-secondary);
        display: block;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 12px;
      }

      .module-action-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .foundation-import-ledger {
        display: grid;
        gap: 14px;
        margin-top: 22px;
      }

      .foundation-ledger-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
      }

      .foundation-ledger-title {
        color: var(--text-primary);
        font-size: 15px;
        font-weight: 780;
      }

      .foundation-ledger-sub {
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      .foundation-ledger-period {
        color: var(--text-secondary);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .foundation-ledger-table {
        overflow: hidden;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
      }

      .foundation-ledger-table .data-table {
        min-width: 100%;
        table-layout: fixed;
      }

      .foundation-ledger-table .data-table th,
      .foundation-ledger-table .data-table td {
        vertical-align: middle;
      }

      .foundation-ledger-table .data-table th:nth-child(1),
      .foundation-ledger-table .data-table td:nth-child(1) {
        width: 110px;
      }

      .foundation-ledger-table .data-table th:nth-child(3),
      .foundation-ledger-table .data-table td:nth-child(3),
      .foundation-ledger-table .data-table th:nth-child(4),
      .foundation-ledger-table .data-table td:nth-child(4) {
        width: 150px;
      }

      .foundation-ledger-table .data-table th:nth-child(5),
      .foundation-ledger-table .data-table td:nth-child(5) {
        width: 100px;
      }

      .foundation-ledger-table .data-table th:nth-child(6),
      .foundation-ledger-table .data-table td:nth-child(6) {
        width: 88px;
      }

      .batch-file-name {
        color: var(--text-primary);
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .batch-file-meta {
        margin-top: 3px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .exception-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .exception-workbench {
        display: grid;
        gap: 16px;
      }

      .exception-filter-panel {
        display: grid;
        grid-template-columns: minmax(180px, 0.7fr) minmax(180px, 0.7fr) minmax(240px, 1fr) auto;
        gap: 12px;
        align-items: end;
        padding: 16px;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        background: #FFFFFF;
      }

      .exception-filter-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .exception-result-strip {
        align-items: center;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: #FFFDF7;
      }

      .exception-result-count {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 760;
      }

      .exception-result-meta {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 650;
        margin-left: 8px;
      }

      .exception-source-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .exception-type-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .exception-source-chip,
      .exception-type-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 999px;
        background: #FFFFFF;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .exception-source-chip.active,
      .exception-type-chip.active,
      .exception-source-chip:hover,
      .exception-type-chip:hover {
        border-color: var(--primary);
        background: #F3EEE3;
      }

      .exception-source-chip span,
      .exception-type-chip span {
        color: var(--text-secondary);
        font-family: var(--mono);
        font-size: 12px;
      }

      .exception-table-shell {
        overflow-x: auto;
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
      }

      .exception-table-shell .data-table {
        min-width: 1060px;
        table-layout: fixed;
      }

      .exception-table-shell .data-table td {
        white-space: normal;
        line-height: 1.55;
        vertical-align: top;
      }

      .exception-table-shell .data-table th:nth-child(1),
      .exception-table-shell .data-table td:nth-child(1) {
        width: 88px;
      }

      .exception-table-shell .data-table th:nth-child(2),
      .exception-table-shell .data-table td:nth-child(2) {
        width: 110px;
      }

      .exception-table-shell .data-table th:nth-child(3),
      .exception-table-shell .data-table td:nth-child(3) {
        width: 150px;
      }

      .exception-table-shell .data-table th:nth-child(4),
      .exception-table-shell .data-table td:nth-child(4) {
        width: 120px;
      }

      .exception-table-shell .data-table td:nth-child(1),
      .exception-table-shell .data-table td:nth-child(2),
      .exception-table-shell .data-table td:nth-child(3),
      .exception-table-shell .data-table td:nth-child(4) {
        white-space: nowrap;
      }

      .exception-table-shell .data-table th:nth-child(5),
      .exception-table-shell .data-table td:nth-child(5) {
        width: 150px;
      }

      .exception-table-shell .data-table th:nth-child(7),
      .exception-table-shell .data-table td:nth-child(7) {
        width: 104px;
      }

      .exception-table-shell .data-table td:nth-child(5),
      .exception-table-shell .data-table td:nth-child(6) {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .exception-row-action {
        background: transparent;
        border: 0;
        color: var(--primary);
        cursor: pointer;
        font-size: 13px;
        font-weight: 760;
        padding: 0;
        text-align: left;
        white-space: nowrap;
      }

      .exception-row-action:hover {
        color: var(--primary-deep);
        text-decoration: underline;
      }

      .exception-summary-item {
        border: 1px solid rgba(226, 232, 240, 0.92);
        border-radius: 8px;
        padding: 14px;
        background: #FFFFFF;
      }

      .exception-summary-label {
        color: var(--text-secondary);
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .exception-summary-value {
        color: var(--text-primary);
        display: block;
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 780;
      }

      .severity-pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 760;
        padding: 4px 9px;
      }

      .severity-pill.error {
        background: #FEE2E2;
        color: #991B1B;
      }

      .severity-pill.warning {
        background: #FEF3C7;
        color: #92400E;
      }

      .severity-pill.info {
        background: #E0F2FE;
        color: #075985;
      }

      .empty-state.compact {
        padding: 44px 20px;
      }

      /* Warm editorial platform skin */
      :root {
        --primary: #2F2A24;
        --primary-deep: #1F1D1A;
        --primary-ink: #1F1D1A;
        --success: #3F7D5A;
        --danger: #B94A48;
        --warning: #A66A2C;
        --bg-main: #F7F3EA;
        --bg-card: #FFFDF7;
        --text-primary: #1F1D1A;
        --text-secondary: #6F685F;
        --border: #DDD4C8;
        --border-strong: #C9BFB1;
        --sidebar-bg: #2B2925;
        --sidebar-text: #CFC6B8;
        --sidebar-active: #F5E7D0;
        --mono: "SF Mono", "Roboto Mono", ui-monospace, monospace;
        --focus-ring: 0 0 0 3px rgba(47, 42, 36, 0.16);
      }

      html,
      body {
        background: var(--bg-main);
      }

      body,
      button,
      input,
      select,
      table {
        font-family: "Styrene A", Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      body {
        background: var(--bg-main);
        color: var(--text-primary);
        font-size: 15px;
        letter-spacing: 0;
        overflow: auto;
      }

      body::before,
      .sidebar::before,
      .kpi-card::after,
      .app-dialog-accent {
        display: none;
      }

      .app-layout {
        gap: 18px;
        padding: 18px;
        background: var(--bg-main);
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .main-content {
        gap: 18px;
        height: auto;
        min-height: calc(100vh - 36px);
        overflow: visible;
      }

      .sidebar {
        width: 236px;
        height: calc(100vh - 36px);
        max-height: calc(100vh - 36px);
        position: sticky;
        top: 18px;
        border: 1px solid #37342F;
        border-radius: 8px;
        background: var(--sidebar-bg);
        box-shadow: none;
      }

      .sidebar-header {
        border-bottom: 1px solid rgba(255, 253, 247, 0.12);
        padding: 22px 22px 24px;
      }

      .sidebar-logo img,
      .empty-state-icon svg,
      .upload-zone-icon svg {
        filter: none;
      }

      .sidebar-logo {
        align-items: center;
        gap: 14px;
      }

      .sidebar-logo img {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        margin: 0;
        object-fit: contain;
      }

      .sidebar-logo-text {
        gap: 4px;
      }

      .sidebar-logo-sigma {
        color: #FFFDF7;
        font-size: 19px;
        font-weight: 760;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .sidebar-logo-brand {
        display: block;
        color: #FFFDF7;
        font-size: 18px;
        font-weight: 760;
        line-height: 1.05;
        letter-spacing: 0.01em;
      }

      .sidebar-logo-sub {
        font-size: 13px;
        line-height: 1.2;
      }

      .sidebar-logo-sub,
      .nav-section-title {
        color: rgba(207, 198, 184, 0.80);
      }

      .nav-section-title {
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      .nav-item {
        color: rgba(255, 253, 247, 0.66);
        border-radius: 6px;
        transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
      }

      .nav-item:hover {
        background: rgba(255, 253, 247, 0.08);
        border-color: rgba(255, 253, 247, 0.10);
        color: #FFFDF7;
        transform: none;
      }

      .nav-item.active {
        background: var(--sidebar-active);
        border-color: var(--sidebar-active);
        color: #1F1D1A;
        box-shadow: none;
      }

      .nav-item-text,
      .btn,
      .filter-field input,
      .app-dialog-field input,
      .data-table,
      .bonus-table {
        font-size: 15px;
      }

      .top-bar,
      .panel,
      .kpi-card,
      .module-panel,
      .panel.module-table-panel,
      .import-summary-item,
      .import-toolbar,
      .import-table-card,
      .result-panel,
      .result-toolbar,
      .results-workbench,
      .bonus-table-card,
      .bonus-table-shell,
      .upload-result-stat,
      .module-action-card,
      .exception-summary-item,
      .meta-list {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card);
        box-shadow: none;
      }

      .top-bar {
        min-height: 72px;
        padding: 16px 20px;
        gap: 20px;
      }

      .top-brand-lockup {
        gap: 12px;
      }

      .top-brand-mark {
        width: 44px;
        height: 44px;
      }

      .top-brand-en {
        color: #7B746B;
        font-size: 13px;
        font-weight: 760;
        letter-spacing: 0.12em;
      }

      .top-brand-cn {
        color: #1F1D1A;
        font-size: 23px;
        font-weight: 800;
        line-height: 1.05;
      }

      .top-module-divider {
        height: 42px;
        background: var(--border-strong);
      }

      .module-eyebrow {
        margin-bottom: 4px;
        color: #7B746B;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0;
      }

      .top-bar-title {
        font-size: 24px;
        font-weight: 760;
        line-height: 1.15;
      }

      .top-bar-subtitle {
        color: var(--text-secondary);
        font-size: 15px;
        font-weight: 650;
      }

      .content-area {
        padding: 0 0 10px;
        overflow: visible;
      }

      .kpi-grid,
      .module-grid {
        gap: 18px;
        margin-bottom: 18px;
      }

      .kpi-card {
        padding: 24px;
        min-height: 134px;
      }

      .kpi-card-label,
      .kpi-card-sub,
      .import-summary-label,
      .summary-stat-label,
      .filter-field label,
      .exception-summary-label,
      .module-panel-label,
      .module-panel-meta {
        color: var(--text-secondary);
        font-weight: 650;
      }

      .kpi-card-value,
      .summary-stat-value,
      .import-summary-value,
      .exception-summary-value,
      .result-summary-value,
      .numeric-cell,
      .money-cell {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .kpi-card-value {
        color: var(--text-primary);
        font-size: 36px;
        font-weight: 780;
      }

      .kpi-card.success .kpi-card-value {
        color: var(--success);
      }

      .kpi-card.warning .kpi-card-value {
        color: var(--warning);
      }

      .kpi-card.danger .kpi-card-value {
        color: var(--danger);
      }

      .panel {
        margin-bottom: 18px;
      }

      .panel-header {
        background: transparent;
        border-bottom: 1px solid var(--border);
        padding: 20px 24px;
      }

      .panel-title,
      .module-section-title {
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 760;
      }

      .panel-title-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .panel-subtitle {
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 650;
      }

      .panel-body {
        padding: 24px;
      }

      .module-panel {
        padding: 24px;
      }

      .module-panel-primary {
        background: #FFF8EA;
      }

      .module-panel-title {
        color: var(--text-primary);
        font-size: 36px;
        font-weight: 760;
        letter-spacing: 0;
      }

      .module-description,
      .module-action-card span,
      .empty-state-sub,
      .upload-zone-sub,
      .app-dialog-message {
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.75;
      }

      .btn {
        min-height: 40px;
        border-radius: 6px;
        box-shadow: none;
        font-weight: 700;
      }

      .btn:hover:not(:disabled) {
        transform: none;
        box-shadow: none;
      }

      .btn:focus-visible,
      .modal-close:focus-visible,
      .upload-zone:focus-visible,
      .exception-chip:focus-visible,
      .month-picker-nav:focus-visible,
      .month-picker-option:focus-visible,
      .pagination-btn:focus-visible,
      .page-size-select:focus-visible,
      .filter-field input:focus-visible,
      .filter-field select:focus-visible,
      .app-dialog-field input:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      .btn-primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #FFFDF7;
      }

      .btn-primary:hover {
        background: var(--primary-deep);
        border-color: var(--primary-deep);
        box-shadow: none;
      }

      .btn-secondary {
        border-color: var(--border-strong);
        background: #FFFDF7;
        color: var(--text-primary);
        box-shadow: none;
      }

      .btn-secondary:hover {
        border-color: var(--primary);
        background: #F4ECDD;
        color: var(--primary);
      }

      .btn-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #FFFDF7;
        box-shadow: none;
      }

      .btn-danger:hover {
        background: #9F3937;
        border-color: #9F3937;
      }

      .btn-warning {
        background: #F2D8A8;
        border-color: #E6C386;
        color: #4B341A;
      }

      .data-table-container,
      .bonus-table-shell {
        border: 1px solid var(--border);

      /* Sigma product skin: align FBU with homepage and recruitment workbench */
      :root {
        --primary: #1E3A8A;
        --primary-deep: #172554;
        --primary-ink: #101828;
        --success: #0F766E;
        --danger: #B42318;
        --warning: #B7791F;
        --bg-main: #EEF3F7;
        --bg-card: rgba(255, 255, 255, 0.64);
        --surface: rgba(255, 255, 255, 0.58);
        --surface-strong: rgba(255, 255, 255, 0.78);
        --text-primary: #101828;
        --text-secondary: #667085;
        --border: rgba(255, 255, 255, 0.72);
        --border-strong: rgba(203, 213, 225, 0.86);
        --sidebar-bg: rgba(255, 255, 255, 0.58);
        --sidebar-text: #475569;
        --sidebar-active: #101828;
        --focus-ring: 0 0 0 4px rgba(37, 99, 235, 0.14);
        --mono: "SF Mono", "Roboto Mono", ui-monospace, monospace;
        --sigma-shadow: 0 28px 76px rgba(15, 23, 42, 0.12), 0 7px 22px rgba(30, 64, 175, 0.06);
        --inner-edge-glow: inset 0 1px 0 rgba(255, 255, 255, 0.86), inset 0 -1px 0 rgba(255, 255, 255, 0.42);
      }

      html,
      body {
        background: var(--bg-main);
      }

      body {
        color: var(--text-primary);
        font-family: Inter, "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        font-feature-settings: "tnum" 1, "cv02" 1, "cv03" 1, "ss01" 1;
        overflow: auto;
      }

      body::before {
        display: block;
        position: fixed;
        inset: 0;
        z-index: -2;
        content: "";
        pointer-events: none;
        background:
          radial-gradient(circle at 18% 16%, rgba(34, 211, 238, 0.30), transparent 30%),
          radial-gradient(circle at 76% 10%, rgba(139, 92, 246, 0.24), transparent 34%),
          radial-gradient(circle at 72% 82%, rgba(37, 99, 235, 0.16), transparent 32%),
          linear-gradient(135deg, #F8FBFF 0%, #EAF2F8 44%, #F6F2FF 100%);
      }

      body::after {
        display: block;
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        opacity: 0.42;
        background-image:
          linear-gradient(rgba(30, 58, 138, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(30, 58, 138, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at center, black, transparent 76%);
      }

      body,
      button,
      input,
      select,
      table {
        font-family: Inter, "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app-layout {
        position: relative;
        z-index: 1;
        gap: 20px;
        padding: 22px;
        background: transparent;
      }

      .main-content {
        gap: 16px;
        min-height: calc(100vh - 44px);
      }

      .sidebar {
        width: 312px;
        height: calc(100vh - 44px);
        max-height: calc(100vh - 44px);
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 30px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        box-shadow: var(--sigma-shadow), var(--inner-edge-glow);
        backdrop-filter: blur(30px) saturate(1.35);
        -webkit-backdrop-filter: blur(30px) saturate(1.35);
        overflow: hidden;
        transition: width 0.22s ease, padding 0.22s ease, border-radius 0.22s ease;
      }

      .sidebar::before {
        display: block;
        position: absolute;
        inset: 0;
        content: "";
        pointer-events: none;
        border-radius: inherit;
        box-shadow: var(--inner-edge-glow);
      }

      .sidebar-header {
        position: relative;
        padding: 8px 40px 20px 6px;
        border-bottom: 1px solid rgba(226, 232, 240, 0.76);
      }

      .sidebar-logo {
        gap: 14px;
        color: var(--text-primary);
        min-width: 0;
      }

      .sidebar-logo img {
        width: 54px;
        height: 54px;
        flex: 0 0 54px;
        filter: drop-shadow(0 16px 26px rgba(34, 211, 238, 0.16)) drop-shadow(0 8px 20px rgba(139, 92, 246, 0.14));
      }

      .sidebar-logo-text {
        gap: 2px;
        min-width: 0;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      .sidebar-logo-en {
        color: #667085;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .sidebar-logo-sigma {
        color: #64748B;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1;
        text-transform: uppercase;
      }

      .sidebar-logo-brand {

        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0.01em;
        line-height: 1.05;
      }

      .sidebar-logo-sub {
        color: #101828;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
        line-height: 1.05;
        white-space: nowrap;

      .nav-section {
        padding: 0;
        margin-bottom: 12px;
      }

      .nav-section-title {
        padding: 14px 8px 6px;
        color: #64748B;
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: opacity 0.16s ease;
      }

      .nav-item {
        margin: 2px 0;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 16px;
        color: #475569;
        transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }

      .nav-item:hover,
      .nav-item.active {
        border-color: rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.70);
        color: #101828;
        transform: translateX(2px);
      }

      .nav-item.active {
        box-shadow: 0 16px 34px rgba(37, 99, 235, 0.13), var(--inner-edge-glow);
      }

      .nav-item-icon {
        color: #2563EB;
        flex: 0 0 20px;
      }

      .nav-item-text {
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      .sidebar-toggle {
        position: absolute;
        top: 12px;
        right: 10px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(203, 213, 225, 0.78);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #334155;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
        transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
      }

      .sidebar-toggle:hover {
        border-color: rgba(37, 99, 235, 0.28);
        background: rgba(255, 255, 255, 0.92);
        color: #1E3A8A;
      }

      .sidebar-toggle:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      body.sidebar-collapsed .sidebar {
        width: 92px;
        padding: 14px;
        border-radius: 28px;
      }

      body.sidebar-collapsed .sidebar-header {
        padding: 46px 0 18px;
      }

      body.sidebar-collapsed .sidebar-logo {
        justify-content: center;
        gap: 0;
      }

      body.sidebar-collapsed .sidebar-logo img {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      body.sidebar-collapsed .nav-section-title,
      body.sidebar-collapsed .nav-item-text {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-6px);
        width: 0;
        overflow: hidden;
      }

      body.sidebar-collapsed .nav-section-title {
        height: 0;
        padding: 0;
      }

      body.sidebar-collapsed .sidebar-toggle {
        top: 4px;
        right: 50%;
        transform: translateX(50%);
        width: 34px;
        height: 34px;
      }

      body.sidebar-collapsed .sidebar-toggle svg {
        transform: rotate(180deg);
      }

      body.sidebar-collapsed .sidebar-nav {
        padding-top: 22px;
      }

      body.sidebar-collapsed .nav-section {
        margin-bottom: 8px;
      }

      body.sidebar-collapsed .nav-item {
        justify-content: center;
        width: 52px;
        height: 52px;
        padding: 0;
        margin: 4px auto;
        border-radius: 18px;
        transform: none;
      }

      body.sidebar-collapsed .nav-item:hover,
      body.sidebar-collapsed .nav-item.active {
        transform: none;
      }

      .kpi-card.warning .kpi-card-value {

      .module-panel-primary {

      .module-panel-title {

        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.03em;

      .activity-progress-segment {

      .activity-row.failed .activity-progress-segment.done {

      .activity-month,

      .activity-metric-value,
      .employee-id,
      .amount-cell,
      .metric-cell,
      .bonus-value,
      .kpi-card-value,
      .summary-stat-value,
      .import-summary-value,
      .exception-summary-value,
      .result-summary-value,

      .money-cell {

      }

        background: rgba(254, 243, 199, 0.86);
        color: #92400E;
      }

      .status-badge.danger,
      .exception-chip,
      .severity-pill.error {
        background: rgba(254, 226, 226, 0.86);
        color: #991B1B;
      }

      .job-pill {
        background: rgba(226, 232, 240, 0.74);

      }

      .meta-label,
      .upload-result-file,
      .result-summary-bar,
      .table-pagination,
      .modal-footer,
      .month-picker-head,
      .calc-chain {
        background: rgba(248, 251, 255, 0.86);

      .upload-zone {

        background: rgba(255, 255, 255, 0.72);
      }

      .upload-zone:hover,
      .upload-zone.is-dragover,
      .upload-zone.has-file {
        border-color: rgba(37, 99, 235, 0.44);
        background: rgba(239, 246, 255, 0.72);

        background: rgba(8, 15, 28, 0.24);

      .modal,

        border: 1px solid rgba(226, 232, 240, 0.86);

      .filter-field input,

      .month-picker-option,
      .pagination-btn {
        border-color: rgba(203, 213, 225, 0.86);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.78);

        box-shadow: var(--inner-edge-glow);

      .month-picker-option:hover,
      .pagination-btn:hover:not(:disabled) {
        border-color: rgba(37, 99, 235, 0.40);

        border: 1px solid rgba(226, 232, 240, 0.86);
        border-radius: 18px;

      .toast-region {
        top: 28px;
        right: 28px;
      }

      @keyframes panelIn {
        from {
          opacity: 0;
          transform: translateY(6px);

        to {

          transform: translateY(0);
        }
