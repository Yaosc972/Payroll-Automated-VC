      .subsection-card {
        margin-top: 24px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        overflow: hidden;
      }

      .subsection-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
      }

      .subsection-head h3 {
        margin: 0 0 6px;
        font-size: 20px;
        color: var(--text-primary);
      }

      .subsection-head p {
        margin: 0;
        color: var(--text-secondary);
      }

      .subsection-actions {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
      }

      .bulk-action-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        background: var(--surface-muted);
      }

      .bulk-action-bar select,
      .bulk-action-bar input {
        height: 40px;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--text-primary);
        font: inherit;
      }

      .bulk-action-bar input {
        min-width: 150px;
      }

      .bulk-check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-primary);
        font-weight: 700;
      }

      .supplemental-leave-card .subsection-head {
        align-items: center;
        padding: 14px 20px;
      }

      .supplemental-leave-card,
      #supplementalLeaveTable {
        overflow-anchor: none;
      }

      .supplemental-leave-card .subsection-head h3 {
        margin-bottom: 2px;
        font-size: 18px;
      }

      .supplemental-leave-card .subsection-head p {
        font-size: 13px;
      }

      .leave-summary-compact {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 20px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .leave-summary-compact div {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }

      .leave-summary-compact span {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
      }

      .leave-summary-compact strong {
        color: var(--text-primary);
        font-family: var(--mono);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .leave-summary-compact .success strong {
        color: var(--success);
      }

      .leave-summary-compact .warning strong {
        color: var(--warning);
      }

      .supplemental-leave-card .import-toolbar {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        padding: 12px 20px;
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        background: var(--surface);
      }

      .supplemental-leave-card .import-toolbar-heading {
        margin-bottom: 8px;
      }

      .supplemental-leave-card .import-toolbar-title {
        font-size: 14px;
      }

      .supplemental-leave-card .import-toolbar-sub {
        font-size: 12px;
      }

      .supplemental-leave-card .import-filter-grid {
        grid-template-columns: 180px 180px 220px;

      .supplemental-leave-card .import-filter-field label {

      }

      .supplemental-leave-card .import-filter-field input,

        font-size: 13px;
      }

      .supplemental-leave-card .import-toolbar-actions .btn {
        height: 34px;
        padding: 0 14px;
      }

      .supplemental-leave-card .bulk-action-bar {

        padding: 10px 20px;
        border-top: none;

      }

      .supplemental-leave-card .bulk-action-bar select,
      .supplemental-leave-card .bulk-action-bar input {
        height: 34px;
        min-width: 0;
        border-radius: 8px;
        font-size: 13px;

      }

      .supplemental-leave-card #bulkLeaveMonth {
        width: 120px;
      }

      .supplemental-leave-card #bulkLeaveHours {
        width: 118px;
      }

      .supplemental-leave-card #bulkLeaveNote {
        width: 230px;
      }

      .supplemental-leave-card .bulk-check {
        gap: 6px;
        min-width: 102px;
        font-size: 13px;
      }

      .supplemental-leave-card .bulk-check input,
      .supplemental-leave-card .supplemental-row-check {
        width: 16px;
        height: 16px;
        min-width: 16px;

      .supplemental-leave-card .bulk-action-bar .btn {
        height: 34px;
        padding: 0 14px;
      }

      .included-hours-cell {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .included-hours-cell input {
        width: 92px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: 600 13px/1 var(--mono);
      }

      .included-hours-cell .btn {
        height: 32px;
        padding: 0 10px;
      }

      .included-hours-cell .suggestion-action-btn {
        color: #1f4f8a;
        border-color: #b7cbe4;
        background: #f4f8fd;
      }

      .data-table tr.row-warning {
        background: #fff8e8;
      }

      .data-table tr.row-muted {
        color: var(--text-secondary);
        background: #f6f3ee;
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .app-layout {
          flex-direction: column;
          padding: 12px;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }

        .sidebar {
          width: 100%;
          height: auto;
          min-height: auto;
          position: relative;
          top: 0;
        }

        .main-content {
          height: auto;
          min-height: auto;
          overflow: visible;
        }

        .content-area {
          overflow: visible;
        }

        .top-bar {
          position: relative;
          top: 0;
          align-items: flex-start;
          gap: 12px;
        }

        .top-bar-right {
          flex-wrap: wrap;
          justify-content: flex-end;
        }

        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .top-bar,
        .panel-header,
        .result-toolbar,
        .import-toolbar,
        .result-summary-bar {
          flex-direction: column;
          align-items: stretch;
        }

        .kpi-grid {
          grid-template-columns: 1fr;
        }

        .top-bar-right,
        .import-toolbar-actions,
        .result-toolbar-actions {
          justify-content: flex-start;
        }
      }

      /* Expert payroll workstation refinement: lower chrome, denser tables, less decorative UI. */
      :root {
        --primary: #172554;
        --primary-deep: #0F1F47;
        --primary-ink: #111827;
        --success: #147A4A;
        --danger: #B42318;
        --warning: #A16207;
        --bg-main: #F5F6F8;
        --bg-card: #FFFFFF;
        --surface: #FFFFFF;
        --surface-strong: #FFFFFF;
        --surface-muted: #F6F8FB;
        --text-primary: #111827;
        --text-secondary: #536171;
        --border: #D9E0EA;
        --border-strong: #BFC9D7;
        --sidebar-bg: #FFFFFF;
        --sidebar-text: #536171;
        --sidebar-active: #111827;
        --focus-ring: 0 0 0 3px rgba(23, 37, 84, 0.14);
        --sigma-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        --inner-edge-glow: none;
      }

      html,
      body {
        background: var(--bg-main);
      }

      body {
        color: var(--text-primary);
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      body::before,
      body::after,
      .sidebar::before,
      .kpi-card::after {
        display: none !important;
      }

      body,
      button,
      input,
      select,
      table {
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-layout {
        gap: 16px;
        padding: 16px;
        background: var(--bg-main);
      }

      .main-content {
        width: 100%;
        min-width: 0;
        min-height: calc(100vh - 32px);
        gap: 14px;
      }

      .content-area {
        padding-bottom: 16px;
      }

      .sidebar {
        width: 236px;
        height: calc(100vh - 32px);
        max-height: calc(100vh - 32px);
        padding: 14px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #FFFFFF;
        color: var(--sidebar-text);
        box-shadow: var(--sigma-shadow);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 58px;
        padding: 0 0 14px;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-logo {
        flex: 1 1 auto;
        gap: 10px;
        min-width: 0;
        color: var(--text-primary);
      }

      .sidebar-logo img {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        filter: none;
      }

      .sidebar-logo-text {
        gap: 2px;
      }

      .sidebar-logo-en {
        color: #667085;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        line-height: 1;
        text-transform: uppercase;
      }

      .sidebar-logo-sub {
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 850;
        letter-spacing: 0;
        line-height: 1.08;
        white-space: nowrap;
      }

      .sidebar-toggle {
        position: static;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: #FFFFFF;
        color: #526173;
        box-shadow: none;
      }

      .sidebar-toggle:hover {
        border-color: #94A3B8;
        background: #F8FAFC;
        color: var(--primary);
      }

      .sidebar-nav {
        padding: 12px 0 0;
        overflow-y: auto;
      }

      .nav-section {
        margin-bottom: 14px;
      }

      .nav-section-title {
        padding: 8px 8px 6px;
        color: #7A8698;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: none;
      }

      .nav-item {
        height: 38px;
        margin: 1px 0;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #475569;
        gap: 10px;
        transform: none;
        box-shadow: none;
      }

      .nav-item:hover,

	        left: 4px;

	        height: 9px;

	      .payroll-activity-stepper {
	        position: relative;
	        display: grid;
	        grid-template-columns: repeat(6, minmax(0, 1fr));
	        gap: 0;
	        margin-bottom: 14px;
	        padding: 12px 0 16px;
	        border: none;
	        border-radius: 0;
	        background: transparent;
	        overflow: visible;
	      }

	      .payroll-activity-stepper::before {
	        display: none;
	      }

	      .payroll-activity-stepper .activity-step {
	        position: relative;
	        z-index: 1;
	        display: grid;
	        grid-template-columns: 36px minmax(0, 1fr);
	        column-gap: 8px;
	        row-gap: 0;
	        min-height: 40px;
	        padding: 0 16px 0 0;
	        border: none;
	        border-radius: 0;
	        background: transparent;
	        box-shadow: none;
	      }

	      .payroll-activity-stepper .activity-step::after {
	        content: "";
	        position: absolute;
	        left: 112px;
	        right: 14px;
	        top: 11px;
	        border-top: 1px dashed #cfd6e1;
	        pointer-events: none;
	        transition: border-color 160ms ease;
	      }

	      .payroll-activity-stepper .activity-step:last-child::after {
	        display: none;
	      }

	      .payroll-activity-stepper .activity-step.done::after {
	        border-top-color: #20c997;
	      }

	      .payroll-activity-stepper .activity-step:hover {
	        background: transparent;
	        color: #155eef;
	      }

	      .payroll-activity-stepper .activity-step:hover::after {
	        border-top-color: #7aa7ff;
	      }

	      .payroll-activity-stepper .activity-step:hover .activity-step-index {
	        border-color: #155eef;
	        background: #eff5ff;
	        color: #155eef;
	        box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.10);
	      }

	      .payroll-activity-stepper .activity-step:hover .activity-step-index.active-pin {
	        border-color: transparent;
	        background: transparent;
	        box-shadow: none;
	      }

	      .payroll-activity-stepper .activity-step.active {
	        border-color: transparent;
	        background: transparent;
	        box-shadow: none;
	      }

	      .payroll-activity-stepper .activity-step-index {
	        grid-row: 1 / span 2;
	        width: 22px;
	        height: 22px;
	        border: 1px solid #cfd8e6;
	        background: #ffffff;
	        color: #98a2b3;
	        font-size: 11px;
	        transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
	      }

	      .activity-step.done .activity-step-index {
	        border-color: #20c997;
	        background: #ecfdf5;
	        color: #079455;
	      }

	      .activity-step.warning .activity-step-index {
	        border-color: #cfd8e6;
	        background: #ffffff;
	        color: #98a2b3;
	      }

	      .activity-step.warning:not(.active) .activity-step-label,
	      .activity-step.warning:not(.active) .activity-step-status,
	      .activity-step:not(.done):not(.active) .activity-step-label,
	      .activity-step:not(.done):not(.active) .activity-step-status {
	        color: #98a2b3;
	      }

	      .payroll-activity-stepper .activity-step.active .activity-step-index {
	        position: relative;
	        border-color: #155eef;
	        background: #155eef;
	        color: #ffffff;
	        box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.12);
	      }

	      .payroll-activity-stepper .activity-step-index.active-pin {
	        width: 34px;
	        height: 40px;
	        margin-top: -8px;
	        border: none;
	        background: transparent;
	        color: #ffffff;
	        box-shadow: none;
	        overflow: visible;
	      }

	      .payroll-activity-stepper .activity-step.active .activity-step-index.active-pin {
	        border-color: transparent;
	        background: transparent;
	        box-shadow: none;
	      }

	      .activity-step-pin {
	        display: block;
	        width: 34px;
	        height: 40px;
	        overflow: visible;

	      }

	      .top-module-nav .nav-item {
	        display: inline-flex;
	        align-items: center;
	        justify-content: center;
	        gap: 6px;
	        width: auto;
	        min-height: 32px;
	        padding: 0 10px;
	        border: 1px solid transparent;
	        border-radius: 6px;
	        background: transparent;
	        color: #475569;
	        font-size: 13px;
	        font-weight: 800;
	        text-decoration: none;
	        box-shadow: none;
	      }

	      .top-module-nav .nav-item:hover {
	        border-color: #CBD5E1;
	        background: #F8FAFC;
	        color: #155EEF;
	      }

	      .top-module-nav .nav-item.active {
	        border-color: #BFDBFE;
	        background: #EFF6FF;
	        color: #155EEF;
	        box-shadow: none;
	      }

	      .top-module-nav .nav-item-icon {
	        width: 18px;
	        height: 18px;
	        display: inline-flex;
	        align-items: center;
	        justify-content: center;
	      }

	      .top-module-nav .nav-item-text {
	        display: inline-flex;
	        max-width: none;
	        opacity: 1;
	        transform: none;
	        overflow: visible;
	        white-space: nowrap;
	      }

	      @media (max-width: 760px) {
	        .top-bar {
	          align-items: flex-start;
	          flex-direction: column;
	        }

	        .top-bar-left {
	          align-items: flex-start;
	          flex-direction: column;
	          gap: 10px;
	        }

	        .top-module-nav {
	          padding-left: 0;
	          border-left: 0;
	        }
	      }
	    </style>
  </head>
  <body>
    <div class="app-layout">
      <!-- ═══ Main Content ═══ -->
      <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
          <div class="top-bar-left">
            <a class="top-module-copy top-title-lockup" href="/" aria-label="返回西格玛工作台首页">
              <img class="top-title-logo" src="assets/bonus-logo-header-blue.png" alt="" />
              <h1 class="top-bar-title">FBU美洲绩效核算</h1>
            </a>
            <nav class="top-module-nav" aria-label="平台模块">
              <a class="nav-item active" href="#workbench" data-page="workbench" aria-current="page">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4h14v12H3V4z" stroke="currentColor" stroke-width="1.5"/><path d="M6 8h3M6 12h3M12 8h2M12 12h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </span>
                <span class="nav-item-text">FBU核算</span>
              </a>
              <a class="nav-item" href="#activities" data-page="activities">
                <span class="nav-item-icon">
                  <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 3h14a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V5a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </span>
                <span class="nav-item-text">活动列表</span>
              </a>
            </nav>
          </div>
          <div class="top-bar-right">
            <button class="btn btn-primary" id="btnNewActivity">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              新建月度活动
            </button>
          </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">
          <!-- One-screen Workbench Page -->
          <div class="page-content" id="pageWorkbench">
            <div class="fbu-activity-detail" id="workbenchContent">
              <div class="workbench-empty">
                <h2>正在读取活动</h2>
                <p>读取最近一次月度活动。</p>
              </div>
            </div>
            <div class="workbench-file-inputs" aria-hidden="true">
              <input id="workbenchUploadRoster" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadAttendance" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadPreviousAttendance" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadPreviousSalary" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadCurrentSalary" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadSalaryAdjustments" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadPerformance" type="file" accept=".xlsx,.xls" />
              <input id="workbenchUploadSupplementalLeave" type="file" accept=".xlsx,.xls" />
            </div>
          </div>

          <!-- Activities Page -->
          <div class="page-content" id="pageActivities" hidden>
            <div class="kpi-grid">
              <div class="kpi-card">
                <div class="kpi-card-label">总活动数</div>
                <div class="kpi-card-value" id="kpiTotalActivities">0</div>
                <div class="kpi-card-sub">月度核算活动</div>
              </div>
              <div class="kpi-card success">
                <div class="kpi-card-label">已完成</div>
                <div class="kpi-card-value" id="kpiCompleted">0</div>
                <div class="kpi-card-sub">核算完成</div>
              </div>
              <div class="kpi-card warning">
                <div class="kpi-card-label">进行中</div>
                <div class="kpi-card-value" id="kpiInProgress">0</div>
                <div class="kpi-card-sub">正在核算</div>
              </div>
              <div class="kpi-card danger">
                <div class="kpi-card-label">异常数</div>
                <div class="kpi-card-value" id="kpiErrors">0</div>
                <div class="kpi-card-sub">需要处理</div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <div class="panel-title-stack">
                  <h2 class="panel-title">月度活动列表</h2>
                  <span class="panel-subtitle">按月度任务处理</span>
                </div>
              </div>
              <div class="panel-body">
                <div class="activity-list-toolbar" id="activitiesBatchBar"></div>
                <div class="data-table-container">
                  <table class="data-table" id="activitiesTable">
                    <thead>
                      <tr>
                        <th class="activity-select-cell">选择</th>
                        <th>任务</th>
                        <th>阶段</th>
                        <th>范围</th>
                        <th>检查</th>
                        <th>奖金总额</th>
                        <th>创建时间</th>
                        <th>操作</th>
                      </tr>
                    </thead>
                    <tbody id="activitiesBody">
                    </tbody>
                  </table>
                </div>
                <div id="activitiesPagination"></div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- App Dialog -->
    <div class="modal-overlay" id="appDialog">
      <div class="modal app-dialog" id="appDialogCard" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
        <div class="app-dialog-accent"></div>
        <div class="modal-header">
          <h3 class="modal-title" id="appDialogTitle">确认操作</h3>
          <button class="modal-close" id="btnCloseAppDialog" type="button" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="app-dialog-message" id="appDialogMessage"></p>
          <div class="app-dialog-field" id="appDialogField" hidden>
            <label for="appDialogInput" id="appDialogInputLabel">输入</label>
            <input type="text" id="appDialogInput" autocomplete="off" />
            <div class="app-dialog-month-picker" id="appDialogMonthPicker" hidden>
              <div class="month-picker-head">
                <button class="month-picker-nav" id="btnAppDialogMonthPrev" type="button" aria-label="上一年">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M8.5 3L4.5 7L8.5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="month-picker-year" id="appDialogMonthYear">2026</div>
                <button class="month-picker-nav" id="btnAppDialogMonthNext" type="button" aria-label="下一年">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 3L9.5 7L5.5 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="month-picker-grid" id="appDialogMonthGrid" role="listbox" aria-label="选择月份"></div>
            </div>
            <div class="app-dialog-help" id="appDialogInputHelp"></div>
            <div class="app-dialog-error" id="appDialogInputError"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btnCancelAppDialog" type="button">取消</button>
          <button class="btn btn-primary" id="btnConfirmAppDialog" type="button">确定</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="ruleListDialog">
      <div class="modal rule-list-modal" role="dialog" aria-modal="true" aria-labelledby="ruleListDialogTitle">
        <div class="modal-header">
          <h3 class="modal-title" id="ruleListDialogTitle">编辑名单</h3>
          <button class="modal-close" type="button" aria-label="关闭" onclick="closeMaintainedRuleDialog()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="ruleListDialogBody"></div>
      </div>
    </div>

    <div class="modal-overlay" id="finalResultExplanationDialog">
      <div class="modal final-result-explanation-modal" role="dialog" aria-modal="true" aria-labelledby="finalResultExplanationTitle">
        <div class="modal-header">
          <h3 class="modal-title" id="finalResultExplanationTitle">计算过程</h3>
          <button class="modal-close" type="button" aria-label="关闭" onclick="closeFinalResultExplanation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="finalResultExplanationBody"></div>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

    <script src="fbu-performance.js?v=fbu-attendance-direct-upload-v1-20260720"></script>
  </body>
</html>
