<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>劳务工薪酬核算 · 西格玛工作台</title>
    <link rel="icon" type="image/png" href="assets/bonus-logo-dark.png" />
    <link rel="stylesheet" href="styles.css?v=30" />
    <script src="permission-guard.js?v=8"></script>
    <style>
      html { color-scheme: light; }

      body.domestic-labor-shell {
        --dl-bg: #eef3f7;
        --dl-panel: #ffffff;
        --dl-panel-soft: #f8fafc;
        --dl-ink: #101828;
        --dl-muted: #667085;
        --dl-faint: #98a2b3;
        --dl-line: rgba(226, 232, 240, 0.68);
        --dl-line-strong: #cbd5e1;
        --dl-accent: #2563eb;
        --dl-accent-strong: #1e3a8a;
        --dl-accent-soft: #eff6ff;
        --dl-info: #2563eb;
        --dl-ok: #0f766e;
        --dl-ok-soft: #ecfdf3;
        --dl-warn: #9a6700;
        --dl-warn-soft: #fffbeb;
        --dl-danger: #b42318;
        --dl-danger-soft: #fef3f2;
        --dl-shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
        --dl-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
        --dl-shadow-lg: 0 16px 32px rgba(16, 24, 40, 0.10);
        margin: 0;
        background: var(--dl-bg);
        color: var(--dl-ink);
        font-family: Inter, Geist, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      .domestic-labor-shell * { box-sizing: border-box; }
      .domestic-labor-shell button,
      .domestic-labor-shell input,
      .domestic-labor-shell textarea { font: inherit; }

      /* ═══ 顶部导航栏：企业级纯净 framing，主色用于强调，面板基底保持冷灰白 ═══ */
      .dl-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        min-height: 56px;
        padding: 0 20px;
        border-bottom: 1px solid var(--dl-line);
        background: #ffffff;
        box-shadow: 0 1px 0 rgba(16, 24, 40, 0.06);
      }

      .dl-topbar-left,
      .dl-topbar-right,
      .dl-title-lockup,
      .dl-top-nav,
      .dl-actions,
      .dl-batch-meta,
      .dl-toolbar,
      .dl-filter-row,
      .dl-status-row,
      .dl-panel-head,
      .dl-drawer-head {
        display: flex;
        align-items: center;
      }

      .dl-topbar-left { gap: 18px; min-width: 0; }
      .dl-topbar-right { gap: 12px; color: var(--dl-muted); font-size: 12px; font-weight: 650; }
      .dl-brand-row { gap: 12px; min-width: 0; }

      .dl-title-lockup {
        gap: 10px;
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }

      .dl-title-lockup img {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }

      .dl-title-lockup strong {
        color: var(--dl-ink);
        font-size: 17px;
        font-weight: 760;
        white-space: nowrap;
      }

      .dl-top-nav {
        gap: 8px;
        padding-left: 18px;
        border-left: 1px solid var(--dl-line);
      }

      .dl-top-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--dl-muted);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .dl-top-nav a.active {
        border-color: rgba(37, 99, 235, 0.24);
        background: var(--dl-accent-soft);
        color: var(--dl-accent);
      }

      .dl-top-meta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .dl-top-meta + .dl-top-meta::before {
        content: "";
        width: 1px;
        height: 14px;
        margin-right: 6px;
        background: var(--dl-line-strong);
      }

      .dl-brand-copy {
        min-width: 0;
        width: 100%;
      }

      .dl-logo {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 16px;
        background: transparent;
        box-shadow: none;
      }

      .dl-logo img {
        max-width: 30px;
        max-height: 30px;
        filter: none;
      }

      .dl-eyebrow {
        margin: 0 0 1px;
        color: var(--dl-muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .dl-title {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 760;
        letter-spacing: -0.02em;
      }

      .dl-product-heading {
        min-width: 0;
        padding-top: 0;
      }

      .dl-product-title {
        margin: 0;
        color: var(--dl-ink);
        font-size: 18px;
        line-height: 1.15;
        font-weight: 760;
        letter-spacing: -0.02em;
      }

      .dl-product-subtitle {
        margin: 4px 0 0;
        color: var(--dl-muted);
        font-size: 12px;
        line-height: 1.45;
        font-weight: 400;
      }

      .dl-batch-meta {
        flex-wrap: wrap;
        gap: 0;
        margin-top: 4px;
        max-width: 560px;
      }

      .dl-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: auto;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--dl-muted);
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
      }

      .dl-chip + .dl-chip::before {
        content: "";
        width: 1px;
        height: 12px;
        margin: 0 10px;
        background: var(--dl-line-strong);
      }

      .dl-chip strong { color: var(--dl-ink); font-weight: 700; }
      .dl-chip.is-warn { color: #B45309; background: transparent; }
      .dl-chip.is-ok { color: #047857; background: transparent; }

      .dl-actions {
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        align-self: center;
        padding-top: 0;
      }

      /* 按钮重构：全面引入微弱双层投影与果冻平滑微动效 */
      .dl-btn,
      .btn-new-batch,
      .btn-download,
      .btn-secondary,
      .btn-primary,
      .btn-primary-lg {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 36px;
        padding: 7px 14px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--dl-ink);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: var(--dl-shadow-sm);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-btn:hover,
      .btn-download:hover,
      .btn-secondary:hover {
        border-color: var(--dl-faint);
        background: var(--dl-bg);
        box-shadow: var(--dl-shadow);
      }

      .dl-btn:active,
      .btn-new-batch:active,
      .btn-download:active,
      .btn-secondary:active,
      .btn-primary:active,
      .btn-primary-lg:active {
        opacity: 0.85;
        box-shadow: none;
      }

      .dl-btn-primary,
      .btn-new-batch,
      .btn-primary,
      .btn-primary-lg {
        border-color: var(--dl-accent);
        background: var(--dl-accent);
        color: #FFFFFF;
        box-shadow: 0 1px 2px rgba(37, 99, 235, 0.12);
      }

      .dl-btn-primary:hover,
      .btn-new-batch:hover,
      .btn-primary:hover,
      .btn-primary-lg:hover {
        background: var(--dl-accent-strong);
        border-color: var(--dl-accent-strong);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }

      .btn-download.disabled {
        opacity: 0.4;
        pointer-events: none;
        box-shadow: none;
        background: #F1F5F9;
        border-color: var(--dl-line);
      }

      /* ═══ 侧边左流程轨重构：消灭厚重感，改用悬浮卡片过渡 ═══ */
      .dl-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: calc(100dvh - 88px);
        transition: grid-template-columns 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-shell.rail-collapsed {
        grid-template-columns: 64px minmax(0, 1fr);
      }

      .dl-rail {
        position: sticky;
        top: 88px;
        height: calc(100dvh - 88px);
        padding: 32px 16px;
        border-right: 1px solid var(--dl-line);
        background: transparent;
        overflow: auto;
      }

      .dl-rail-toggle,
      .dl-aside-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-rail-toggle:hover,
      .dl-aside-toggle:hover {
        border-color: var(--dl-accent);
        color: var(--dl-accent);
        box-shadow: var(--dl-shadow);
      }

      .dl-rail-toggle {
        width: 100%;
        margin: 0 0 16px;
      }

      .dl-rail-toggle-icon,
      .dl-aside-toggle-icon {
        font-size: 14px;
        line-height: 1;
      }

      .dl-shell.rail-collapsed .dl-rail {
        padding: 24px 8px;
      }

      .dl-shell.rail-collapsed .dl-rail-toggle {
        width: 40px;
        height: 34px;
        margin-inline: auto;
        padding: 0;
      }

      .dl-shell.rail-collapsed .dl-rail-toggle-text,
      .dl-shell.rail-collapsed .dl-rail-title,
      .dl-shell.rail-collapsed .dl-step-name,
      .dl-shell.rail-collapsed .dl-step-state {
        display: none;
      }

      .dl-shell.rail-collapsed .dl-step {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 10px 8px;
      }

      .dl-shell.rail-collapsed .dl-step::before {
        left: auto;
        right: 0;
      }

      .dl-rail-title {
        margin: 0 0 16px;
        padding: 0 12px;
        color: var(--dl-faint);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .dl-step {
        position: relative;
        width: 100%;
        display: grid;
        grid-template-columns: 24px 1fr auto;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--dl-muted);
        text-align: left;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* 将左侧指示条改造得更加精致内敛 */
      .dl-step::before {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 999px;
        background: transparent;
        transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-step:hover {
        background: rgba(255, 255, 255, 0.8);
        color: var(--dl-ink);
      }

      .dl-step.active {
        background: #FFFFFF;
        color: var(--dl-accent);
        box-shadow: var(--dl-shadow);
      }

      .dl-step.active::before { background: var(--dl-accent); }

      .dl-step-index {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 6px; /* 国际流行的小方圆角 */
        background: #FFFFFF;
        color: var(--dl-faint);
        font-size: 11px;
        font-weight: 600;
      }

      .dl-step.active .dl-step-index {
        border-color: var(--dl-accent);
        background: var(--dl-accent-soft);
        color: var(--dl-accent);
      }

      .dl-step-name { font-size: 13px; font-weight: 500; }

      .dl-step-state {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--dl-line-strong);
      }

      .dl-step.done .dl-step-state { background: var(--dl-ok); }
      .dl-step.warn .dl-step-state { background: var(--dl-warn); }

      /* ═══ 主工作台区域 ═══ */
      .dl-main {
        min-width: 0;
        padding: 16px;
      }

      .dl-main-full { width: 100%; padding: 16px 20px 24px; }

      .dl-shell-subject { grid-template-columns: 1fr; }

      .dl-view {
        display: none;
      }

      .dl-view[hidden] { display: none !important; }

      .dl-view.active {
        display: block;
      }

      .dl-view .dl-panel {
        margin-top: 16px;
      }

      .dl-subject-hero {
        margin-bottom: 16px;
      }

      .dl-subject-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .dl-subject-card {
        min-height: 150px;
        padding: 20px;
        border: 1px solid var(--dl-line);
        border-radius: 20px;
        background: var(--dl-panel);
        color: var(--dl-ink);
        text-align: left;
        display: grid;
        gap: 10px;
        cursor: pointer;
        box-shadow: var(--dl-shadow-sm);
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      }

      .dl-subject-card.primary {
        border-color: var(--dl-accent);
        box-shadow: var(--dl-shadow-sm);
      }

      .dl-subject-card:hover { border-color: var(--dl-accent); box-shadow: var(--dl-shadow); background: var(--dl-accent-soft); }

      .dl-subject-card strong {
        font-size: 22px;
        font-weight: 800;
      }

      .dl-subject-card span {
        color: var(--dl-muted);
      }

      .dl-subject-card em {
        color: var(--dl-accent);
        font-style: normal;
        font-weight: 700;
      }

      .dl-subject-kicker {
        color: var(--dl-muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dl-actions-inline {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dl-month-field {
        display: grid;
        gap: 8px;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .dl-month-field input {
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        outline: 0;
        background: #ffffff;
        color: var(--dl-ink);
        font: inherit;
        font-weight: 800;
      }

      .dl-month-field input:focus {
        border-color: var(--dl-accent);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .dl-month-picker {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .dl-month-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        border: 1px solid var(--dl-line);
        border-radius: 8px;
        background: var(--dl-panel-soft);
      }

      .dl-month-picker-year {
        color: var(--dl-ink);
        font-size: 15px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .dl-month-picker-nav {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--dl-muted);
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
      }

      .dl-month-picker-nav:hover {
        border-color: var(--dl-accent);
        color: var(--dl-accent);
        background: rgba(37, 99, 235, 0.06);
      }

      .dl-month-picker-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .dl-month-picker-option {
        height: 38px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        background: #ffffff;
        color: var(--dl-ink);
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      }

      .dl-month-picker-option:hover {
        border-color: var(--dl-accent);
        color: var(--dl-accent);
        background: rgba(37, 99, 235, 0.06);
      }

      .dl-month-picker-option.selected {
        border-color: var(--dl-accent);
        background: var(--dl-accent);
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      .dl-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 55;
        display: none;
        place-items: center;
        padding: 24px;
        background: rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(5px);
      }

      .dl-modal-backdrop.visible { display: grid; }

      .dl-modal {
        width: min(420px, 100%);
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: var(--dl-shadow-lg);
        overflow: hidden;
      }

      .dl-calc-modal {
        width: min(760px, calc(100vw - 40px));
      }

      .dl-calc-modal .dl-modal-body {
        display: grid;
        gap: 12px;
        max-height: min(70dvh, 680px);
        overflow: auto;
      }

      .dl-modal-head,
      .dl-modal-body,
      .dl-modal-foot {
        padding: 18px 20px;
      }

      .dl-modal-head {
        border-bottom: 1px solid var(--dl-line);
      }

      .dl-modal-title {
        margin: 0;
        color: var(--dl-ink);
        font-size: 16px;
        font-weight: 760;
      }

      .dl-modal-sub {
        margin: 6px 0 0;
        color: var(--dl-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .dl-modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--dl-line);
        background: var(--dl-panel-soft);
      }

      .dl-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 12px;
        align-items: start;
        transition: grid-template-columns 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-grid-workbench {
        grid-template-columns: minmax(0, 1fr) 260px;
      }

      .dl-shell.aside-collapsed .dl-grid {
        grid-template-columns: minmax(0, 1fr) 52px;
      }

      .dl-stack {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .dl-panel {
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: var(--dl-panel);
        box-shadow: var(--dl-shadow);
        overflow: hidden;
      }

      .dl-panel-head {
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--dl-line);
        background: #f8fafc;
      }

      .dl-workbench-head .dl-panel-head {
        align-items: center;
        gap: 12px 18px;
        flex-wrap: wrap;
      }

      .dl-panel-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
      }

      .dl-panel-sub {
        margin: 3px 0 0;
        color: var(--dl-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .dl-panel-body { padding: 14px; }

      /* ═══ 财务 KPI 看板：消灭大色块与黑线，改用宽阔的呼吸感分隔 ═══ */
      .dl-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        border-top: 1px solid var(--dl-line);
        background: #FFFFFF;
      }

      .dl-metric {
        min-width: 0;
        padding: 24px;
        border-right: 1px solid var(--dl-line);
        background: #FFFFFF;
      }

      .dl-metric:last-child { border-right: 0; }

      .dl-metric-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 500;
      }

      .dl-metric-value {
        display: block;
        margin-top: 12px;
        color: var(--dl-ink);
        font-size: 26px; /* 黄金比例字号 */
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .dl-metric-meta {
        margin-top: 8px;
        color: var(--dl-faint);
        font-size: 12px;
        line-height: 1.45;
      }

      .dl-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--dl-accent);
      }

      .dl-toolbar {
        justify-content: space-between;
        gap: 14px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--dl-line);
        background: #FFFFFF;
      }

      .dl-toolbar-compact {
        justify-content: flex-end;
        background: #ffffff;
      }

      .dl-result-summary {
        display: grid;
        grid-template-columns: minmax(170px, 1.2fr) repeat(4, minmax(110px, 0.7fr));
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--dl-line);
        background: #ffffff;
      }

      .dl-result-stat {
        min-width: 0;
        padding: 9px 10px;
        border: 1px solid var(--dl-line);
        border-radius: 8px;
        background: #ffffff;
      }

      .dl-result-stat.primary {
        border-color: rgba(37, 99, 235, 0.22);
        background: var(--dl-accent-soft);
      }

      .dl-result-stat.warning {
        border-color: rgba(154, 103, 0, 0.26);
        background: var(--dl-warn-soft);
      }

      .dl-result-stat span {
        display: block;
        color: var(--dl-muted);
        font-size: 11px;
        font-weight: 700;
      }

      .dl-result-stat strong {
        display: block;
        margin-top: 3px;
        color: var(--dl-ink);
        font-size: 20px;
        line-height: 1.05;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .dl-result-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--dl-line);
        background: #f8fafc;
      }

      .dl-result-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .dl-result-tab strong {
        color: var(--dl-ink);
        font-variant-numeric: tabular-nums;
      }

      .dl-result-tab.active {
        border-color: rgba(37, 99, 235, 0.32);
        background: var(--dl-accent-soft);
        color: var(--dl-accent);
      }

      .dl-filter-row { gap: 8px; flex-wrap: wrap; }

      .dl-table-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .dl-search,
      .dl-select {
        min-height: 34px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--dl-ink);
        font: inherit;
        font-size: 12px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .dl-search {
        width: min(300px, 100%);
        padding: 7px 14px;
      }

      .dl-select {
        padding: 7px 34px 7px 12px;
      }

      .dl-search:focus,
      .dl-select:focus {
        border-color: var(--dl-accent);
        box-shadow: 0 0 0 3px var(--dl-accent-soft);
      }

      .dl-result-count {
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* 状态分段选择器 */
      .dl-segment {
        min-height: 32px;
        padding: 6px 12px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 6px;
        background: #FFFFFF;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-segment:hover {
        border-color: var(--dl-faint);
        color: var(--dl-ink);
      }

      .dl-segment.active {
        border-color: var(--dl-accent);
        background: var(--dl-accent-soft);
        color: var(--dl-accent);
        font-weight: 600;
      }

      .dl-segment.compact {
        min-height: 28px;
        padding: 4px 8px;
        font-size: 12px;
      }

      .dl-segment:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .dl-table-wrap {
        overflow: auto;
        max-height: min(76dvh, 860px);
      }

      .dl-result-table .sticky-col {
        position: sticky;
        z-index: 2;
        background: #ffffff;
      }

      .dl-result-table th.sticky-col {
        z-index: 3;
        background: #f8fafc;
      }

      .dl-result-table .id-col {
        left: 0;
        min-width: 132px;
      }

      .dl-result-table .name-col {
        left: 132px;
        min-width: 112px;
        box-shadow: 1px 0 0 var(--dl-line);
      }

      .dl-table .wrap-cell {
        max-width: 220px;
        white-space: normal;
        word-break: break-word;
      }

      .dl-pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-top: 1px solid var(--dl-line);
        background: #ffffff;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .dl-pagination-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ═══ 高级数据表格：消灭深重边框，转换为清爽的横向信息流 ═══ */
      .dl-table {
        width: 100%;
        min-width: 980px;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }

      .dl-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 12px;
        border-bottom: 1px solid var(--dl-line-strong);
        background: #F8FAFC;
        color: var(--dl-muted);
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.4;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .dl-table td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--dl-line);
        background: #FFFFFF;
        color: #334155;
        line-height: 1.45;
        white-space: nowrap;
      }

      .dl-table tbody tr {
        cursor: pointer;
        transition: background 0.15s ease;
      }

      /* 极其轻微的 Hover 反馈，拒绝刺眼色块 */
      .dl-table tbody tr:hover td { background: var(--dl-bg); }

      .dl-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .dl-strong { font-weight: 600; color: var(--dl-ink); }

      /* 财务异常/正常状态标签 */
      .dl-badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border-radius: 6px;
        border: 0;
        background: #F1F5F9;
        color: var(--dl-muted);
        font-size: 12px;
        font-weight: 500;
      }

      .dl-badge.warn { background: var(--dl-warn-soft); color: #B45309; }
      .dl-badge.ok { background: var(--dl-ok-soft); color: #15803D; }
      .dl-badge.block { background: var(--dl-danger-soft); color: #B91C1C; }

      .dl-aside {
        position: sticky;
        top: 72px;
        display: grid;
        gap: 8px;
        max-height: calc(100dvh - 88px);
        min-width: 0;
      }

      .dl-aside-toggle {
        position: relative;
        width: 100%;
        align-self: start;
        min-height: 28px;
        border-radius: 6px;
        background: #ffffff;
      }

      .dl-aside-toggle-main {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .dl-aside-count {
        position: absolute;
        top: -8px;
        right: -8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--dl-danger);
        color: #ffffff;
        box-shadow: 0 0 0 2px #ffffff;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        writing-mode: horizontal-tb;
      }

      .dl-shell.aside-collapsed .dl-aside {
        gap: 0;
      }

      .dl-shell.aside-collapsed .dl-aside-toggle {
        width: 44px;
        min-height: 148px;
        padding: 10px 0;
        writing-mode: vertical-rl;
        border-radius: 12px;
      }

      .dl-shell.aside-collapsed .dl-aside-toggle-icon {
        transform: rotate(90deg);
      }

      .dl-shell.aside-collapsed .dl-aside-count {
        top: -7px;
        right: -7px;
      }

      .dl-shell.aside-collapsed .dl-aside-panel {
        display: none;
      }

      /* 异常项卡片重构：更干净的警示边缘 */
      .dl-exception-list {
        display: grid;
        gap: 8px;
        max-height: calc(100dvh - 250px);
        min-height: 140px;
        overflow-y: auto;
        padding-right: 4px;
        overscroll-behavior: contain;
      }

      .dl-exception {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--dl-line);
        border-left: 2px solid var(--dl-warn);
        border-radius: 7px;
        background: #FFFFFF;
        text-align: left;
        box-shadow: var(--dl-shadow-sm);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .dl-exception:hover {
        border-color: var(--dl-line-strong);
        box-shadow: var(--dl-shadow);
        transform: translateY(-1px);
      }

      .dl-exception.block { border-left-color: var(--dl-danger); }

      .dl-exception-title {
        margin: 0;
        color: var(--dl-ink);
        font-size: 12px;
        font-weight: 600;
      }

      .dl-exception-meta {
        margin: 4px 0 0;
        color: var(--dl-muted);
        font-size: 11px;
        line-height: 1.45;
      }

      /* ═══ 空状态样式 ═══ */
      .dl-empty {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 32px;
        align-items: center;
        padding: 32px;
      }

      .dl-empty h2 {
        margin: 12px 0 0;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .dl-empty p {
        max-width: 62ch;
        margin: 12px 0 0;
        color: var(--dl-muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .dl-empty-map {
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: #FFFFFF;
        box-shadow: var(--dl-shadow);
        overflow: hidden;
      }

      .dl-empty-map-row {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--dl-line);
        font-size: 12px;
      }

      .dl-empty-map-row:last-child { border-bottom: 0; }
      .dl-empty-map-row strong { color: var(--dl-accent); font-weight: 600; }

      /* ═══ 右侧向导侧滑抽屉：现代 SaaS 高级毛玻璃叠层 ═══ */
      .wizard-drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 60;
        width: min(640px, 94vw);
        height: 100dvh;
        transform: translateX(105%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        border-left: 1px solid var(--dl-line);
        background: #FFFFFF;
        box-shadow: -10px 0 30px -5px rgba(15, 23, 42, 0.08);
        overflow: auto;
      }

      .wizard-drawer.open { transform: translateX(0); }

      .drawer-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        background: rgba(15, 23, 42, 0.15); /* 柔和阴影遮罩 */
        backdrop-filter: blur(4px);         /* 现代高质感高斯模糊 */
      }

      .drawer-overlay.visible { display: block; }

      .drawer-chrome {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 24px 24px 16px;
        border-bottom: 1px solid var(--dl-line);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
      }

      .drawer-header { display: flex; justify-content: space-between; gap: 14px; }

      .drawer-eyebrow {
        margin: 0 0 4px;
        color: var(--dl-faint);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .drawer-title { margin: 0; font-size: 18px; font-weight: 600; }

      .btn-close-drawer {
        width: 32px;
        height: 32px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--dl-muted);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-close-drawer:hover {
        background: var(--dl-bg);
        color: var(--dl-ink);
        border-color: var(--dl-faint);
      }

      /* 抽屉内部步骤切换条：更具空气感的下划线连通器 */
      .wizard-steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        margin-top: 24px;
        border-bottom: 1px solid var(--dl-line-strong);
      }

      .wz-step {
        position: relative;
        min-height: 40px;
        padding: 0 4px 12px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--dl-faint);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .wz-step::after {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: -1px;
        height: 2px;
        border-radius: 999px;
        background: transparent;
        transition: background 0.2s ease;
      }

      .wz-step span {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-right: 6px;
        border-radius: 5px;
        background: #F1F5F9;
        color: var(--dl-muted);
        font-size: 10px;
        font-weight: 600;
      }

      .wz-step:hover { color: var(--dl-ink); }

      .wz-step.active {
        color: var(--dl-accent);
        font-weight: 600;
      }

      .wz-step.active::after { background: var(--dl-accent); }
      .wz-step.active span { background: var(--dl-accent-soft); color: var(--dl-accent); }

      .drawer-body { padding: 24px; }
      .wz-panel { display: none; }
      .wz-panel.active { display: block; }

      .field-section { margin-bottom: 24px; }
      .field-hint { margin: 0 0 14px; color: var(--dl-muted); font-size: 13px; line-height: 1.6; }
      .field-group { display: grid; gap: 8px; }
      .field-label { color: var(--dl-muted); font-size: 12px; font-weight: 600; }

      /* 输入框重构：极致平滑聚焦 */
      .field-input,
      .field-textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--dl-ink);
        background: #FFFFFF;
        outline: none;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
        transition: all 0.2s ease;
      }

      .field-input:focus,
      .field-textarea:focus {
        border-color: var(--dl-accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
      }

      .field-textarea { resize: vertical; }

      /* 引擎选择卡片重构 */
      .engine-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

      .engine-card {
        display: grid;
        grid-template-columns: 36px 1fr 20px;
        gap: 12px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 12px;
        background: #FFFFFF;
        cursor: pointer;
        box-shadow: var(--dl-shadow-sm);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .engine-card:hover {
        border-color: var(--dl-faint);
        background: var(--dl-bg);
      }

      .engine-card.selected {
        border-color: var(--dl-accent);
        background: var(--dl-accent-soft);
      }

      .engine-card-icon {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid #DBEAFE;
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--dl-accent);
        font-weight: 700;
      }

      .engine-card-name { margin: 0; font-size: 14px; font-weight: 600; }
      .engine-card-desc { margin: 4px 0 0; color: var(--dl-muted); font-size: 12px; line-height: 1.45; }
      .engine-card-check { opacity: 0; color: var(--dl-accent); transition: opacity 0.2s ease; }
      .engine-card.selected .engine-card-check { opacity: 1; }

      .upload-zone {
        position: relative;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 58px;
        padding: 10px 14px;
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: #FFFFFF;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .upload-zone:hover,
      .upload-zone.has-file {
        border-color: var(--dl-accent);
        background: #FFFFFF;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      .upload-zone input {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0;
        cursor: pointer;
      }
      .upload-title { margin: 0; font-weight: 700; font-size: 14px; white-space: nowrap; }
      .upload-sub { flex: 1; margin: 0; }
      .upload-zone::after {
        content: "选择文件";
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--dl-line-strong);
        border-radius: 8px;
        color: var(--dl-accent);
        background: var(--dl-panel-soft);
        font-size: 13px;
        font-weight: 700;
        pointer-events: none;
      }
      
      .upload-sub,
      .template-hint,
      .inline-status { color: var(--dl-muted); font-size: 12px; line-height: 1.5; }

      .template-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
      .template-hint { width: 100%; margin: 0; }

      .template-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 4px 12px;
        border: 1px solid #DBEAFE;
        border-radius: 999px;
        background: #FFFFFF;
        color: var(--dl-accent);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .template-link:hover { background: var(--dl-accent-soft); border-color: var(--dl-accent); }

      .drawer-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-top: 20px;
        border-top: 1px solid var(--dl-line);
      }

      .drawer-footer.compact {
        padding-top: 14px;
      }

      .dl-stepper {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        margin-top: 0;
        padding: 12px 16px 16px;
        border: none;
        background: transparent;
        overflow: visible;
      }

      .dl-stepper-item {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        column-gap: 8px;
        row-gap: 0;
        align-items: start;
        min-height: 40px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--dl-muted);
        padding: 0 16px 0 0;
        font-weight: 700;
        text-align: left;
        box-shadow: none;
      }

      .dl-stepper-item::after {
        content: "";
        position: absolute;
        left: 110px;
        right: 14px;
        top: 11px;
        border-top: 1px dashed var(--dl-line-strong);
        pointer-events: none;
        transition: border-color 160ms ease;
      }

      .dl-stepper-item:last-child::after { display: none; }
      .dl-stepper-item.done::after { border-top-color: #20c997; }

      .dl-stepper-index {
        grid-row: 1 / span 2;
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        margin-right: 0;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--dl-line);
        color: var(--dl-muted);
        font-size: 11px;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
      }

      .dl-stepper-item.active {
        border-color: transparent;
        background: transparent;
        color: var(--dl-accent);
        font-weight: 700;
      }

      .dl-stepper-item.active .dl-stepper-index {
        border-color: var(--dl-accent);
        background: var(--dl-accent);
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .dl-stepper-item.active .dl-stepper-index.active-pin {
        width: 34px;
        height: 40px;
        margin-top: -8px;
        border: none;
        background: transparent;
        color: #ffffff;
        box-shadow: none;
        overflow: visible;
      }

      .dl-stepper-item.done {
        color: var(--dl-ok);
      }

      .dl-stepper-item.done .dl-stepper-index {
        border-color: #20c997;
        background: #ecfdf5;
        color: #079455;
      }

      .dl-stepper-pin {
        display: block;
        width: 34px;
        height: 40px;
        overflow: visible;
      }

      .dl-stepper-pin-shadow { fill: rgba(37, 99, 235, 0.14); }
      .dl-stepper-pin-halo { fill: #dfe8ff; }
      .dl-stepper-pin-body { fill: var(--dl-accent); }
      .dl-stepper-pin-text {
        fill: #ffffff;
        font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace;
        font-size: 22px;
        font-weight: 800;
        dominant-baseline: middle;
      }

      .dl-stepper-label {
        color: #344054;
        font-size: 13px;
        font-weight: 750;
        line-height: 1.35;
      }

      .dl-stepper-item.active .dl-stepper-label {
        color: var(--dl-accent);
      }

      .dl-stepper-status {
        min-height: 0;
        padding: 0;
        border-radius: 0;
        background: transparent;
        color: var(--dl-faint);
        font-size: 11px;
        font-weight: 650;
      }

      .dl-stepper-status.success { color: #12a075; }
      .dl-stepper-item.active .dl-stepper-status { color: var(--dl-accent); }

      .dl-upload-list {
        display: grid;
        gap: 0;
        margin-bottom: 16px;
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        overflow: hidden;
      }

      .dl-upload-row {
        display: grid;
        grid-template-columns: 160px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border: 0;
        border-bottom: 1px solid var(--dl-line);
        border-radius: 0;
        background: #ffffff;
      }

      .dl-upload-row:last-child { border-bottom: 0; }
      .dl-upload-row strong { color: var(--dl-ink); }

      .dl-field-groups {
        display: grid;
        gap: 12px;
      }

      .dl-field-group {
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        padding: 0;
        background: var(--dl-panel);
        overflow: hidden;
      }

      .dl-field-group h3 {
        margin: 0;
        padding: 13px 16px;
        border-bottom: 1px solid var(--dl-line);
        background: var(--dl-panel-soft);
        font-size: 14px;
      }

      .dl-field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
      }

      .dl-field-pill {
        display: inline-flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 42px;
        border-radius: 0;
        padding: 10px 16px;
        border: 0;
        border-right: 1px solid var(--dl-line);
        border-bottom: 1px solid var(--dl-line);
        background: #ffffff;
        color: var(--dl-ink);
        font-weight: 650;
      }

      .dl-field-pill:nth-child(2n) { border-right: 0; }

      .dl-field-pill.ok {
        border-color: var(--dl-line);
        background: #ffffff;
        color: var(--dl-ink);
      }

      .dl-field-pill::after {
        content: "已识别";
        color: var(--dl-ok);
        font-size: 12px;
        font-weight: 700;
      }

      /* 核算结果总结网格 */
      .confirm-summary {
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: #FFFFFF;
        box-shadow: var(--dl-shadow-sm);
        overflow: hidden;
      }

      .confirm-summary h3 { margin: 0; padding: 16px; border-bottom: 1px solid var(--dl-line); font-size: 14px; font-weight: 600; }
      .confirm-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
      
      .confirm-item {
        display: grid;
        gap: 4px;
        padding: 16px;
        border-right: 1px solid var(--dl-line);
        border-bottom: 1px solid var(--dl-line);
      }

      .confirm-label { color: var(--dl-muted); font-size: 12px; font-weight: 500; }
      .confirm-value { color: var(--dl-ink); font-weight: 600; }

      /* ═══ 解释说明侧滑抽屉重构 ═══ */
      .dl-explain-drawer {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 70;
        width: min(580px, 96vw);
        height: 100dvh;
        transform: translateX(105%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        border-left: 1px solid var(--dl-line);
        background: #FFFFFF;
        box-shadow: -10px 0 30px -5px rgba(15, 23, 42, 0.08);
        overflow: auto;
      }

      .dl-explain-drawer.open { transform: translateX(0); }

      .dl-drawer-head {
        position: sticky;
        top: 0;
        z-index: 2;
        justify-content: space-between;
        gap: 14px;
        padding: 24px;
        border-bottom: 1px solid var(--dl-line);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
      }

      .dl-drawer-body { padding: 24px; display: grid; gap: 16px; }
      .dl-kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

      .dl-kv {
        padding: 14px;
        border: 1px solid var(--dl-line);
        border-radius: 10px;
        background: #F8FAFC;
      }

      .dl-kv span { display: block; color: var(--dl-muted); font-size: 12px; }
      .dl-kv strong { display: block; margin-top: 4px; color: var(--dl-ink); font-size: 14px; font-weight: 600; }

      /* 规则详情定义卡片 */
      .dl-rule-card {
        border: 1px solid var(--dl-line);
        border-radius: 12px;
        background: #FFFFFF;
        box-shadow: var(--dl-shadow-sm);
        overflow: hidden;
      }

      .dl-rule-card h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--dl-line); font-size: 13px; font-weight: 600; }
      .dl-rule-card dl { display: grid; grid-template-columns: 120px 1fr; gap: 0; margin: 0; }
      
      .dl-rule-card dt,
      .dl-rule-card dd { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--dl-line); font-size: 13px; line-height: 1.5; }
      .dl-rule-card dt { color: var(--dl-muted); background: #F8FAFC; font-weight: 500; }
      .dl-rule-card dd { color: #334155; }

      /* ═══ 全局黑金吐司提示（Toast） ═══ */
      .dl-toast,
      .labor-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 90;
        max-width: 380px;
        padding: 14px 18px;
        border: 1px solid #1E293B;
        border-radius: 8px;
        background: #0F172A;
        color: #FFFFFF;
        font-size: 13px;
        font-weight: 500;
        box-shadow: var(--dl-shadow-lg);
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }

      .labor-toast.visible { opacity: 1; transform: translateY(0); }
      .error-text { color: var(--dl-danger); }

      /* ═══ 响应式超宽屏/窄屏体验调优 ═══ */
      @media (max-width: 1180px) {
        .dl-subject-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dl-grid-workbench { grid-template-columns: 1fr; }
      }

      @media (max-width: 760px) {
        .dl-main-full { padding: 16px; }
        .dl-subject-grid, .dl-stepper { grid-template-columns: 1fr; }
        .dl-upload-row { grid-template-columns: 1fr; }

        .dl-topbar {
          grid-template-columns: 1fr;
          min-height: auto;
          padding: 22px 18px;
        }
        .dl-brand-row { gap: 16px; }
        .dl-logo { width: 62px; height: 62px; }
        .dl-logo img { max-width: 58px; max-height: 58px; }
        .dl-title { font-size: 30px; }
        .dl-product-title { font-size: 28px; }
        .dl-product-subtitle { font-size: 16px; }
        .dl-actions { justify-content: flex-start; }
        .dl-main { padding: 16px; }
        .dl-main-full { padding: 16px; }
        .dl-empty { grid-template-columns: 1fr; padding: 20px; }
        .dl-metrics, .engine-card-grid, .confirm-grid, .dl-kv-grid { grid-template-columns: 1fr; }
        .wizard-steps { grid-template-columns: 1fr 1fr; row-gap: 8px; border-bottom: 0; }
        .wz-step { border-bottom: 1px solid var(--dl-line); }
      }
    </style>
  </head>
  <body class="domestic-labor-shell">

    <header class="dl-topbar">
      <div class="dl-topbar-left">
        <a class="dl-title-lockup" href="/" aria-label="返回西格玛工作台首页">
          <img src="assets/bonus-logo-header-blue.png" alt="" />
          <strong>国内劳务薪酬中台</strong>
        </a>
        <nav class="dl-top-nav" aria-label="国内劳务模块">
          <a class="active" href="#subjectHomeView">薪酬科目</a>
          <a href="#canbuBatchListView">批次列表</a>
        </nav>
      </div>
      <div class="dl-topbar-right">
        <span class="dl-top-meta">批次 <strong id="batchNameText">2026年06月核算草稿</strong></span>
        <span class="dl-top-meta">规则包 <strong>DL-PAYROLL.v1</strong></span>
        <span class="dl-top-meta is-warn" id="batchStatusText">草稿</span>
        <span class="dl-top-meta" id="chromeRunBadge" hidden><span id="chromeRunLabel">任务 #—</span></span>
      </div>
    </header>

    <div class="dl-shell dl-shell-subject" id="payrollShell">
      <main class="dl-main dl-main-full">
        <section class="dl-view active" id="subjectHomeView" data-view="home">
          <div class="dl-metrics kpi-6col" id="kpiBanner" hidden></div>
          <div class="dl-panel dl-subject-hero">
            <div class="dl-panel-head">
              <div>
                <h2 class="dl-panel-title">选择核算科目</h2>
                <p class="dl-panel-sub">先选择本次要处理的薪酬科目，再进入对应核算批次。</p>
              </div>
            </div>
            <div class="dl-subject-grid" id="subjectCardGrid">
              <button class="dl-subject-card primary" data-subject-entry="canbu" type="button">
                <span class="dl-subject-kicker">Meal Allowance</span>
                <strong>餐补</strong>
                <span>样板科目，可进入批次列表</span>
                <em>进入餐补核算</em>
              </button>
              <button class="dl-subject-card" data-subject-entry="gonglingjiang" type="button">
                <span class="dl-subject-kicker">Seniority Bonus</span>
                <strong>工龄奖</strong>
                <span>已配置，后续按同模式改造</span>
                <em>进入工龄奖核算</em>
              </button>
              <button class="dl-subject-card" data-subject-entry="quanqinjiang" type="button">
                <span class="dl-subject-kicker">Attendance Bonus</span>
                <strong>全勤奖</strong>
                <span>已配置，后续按同模式改造</span>
                <em>进入全勤奖核算</em>
              </button>
              <button class="dl-subject-card" data-subject-entry="waisu_butie" type="button">
                <span class="dl-subject-kicker">Housing Allowance</span>
                <strong>外宿补贴</strong>
                <span>已配置，后续按同模式改造</span>
                <em>进入外宿补贴核算</em>
              </button>
            </div>
          </div>

          <section class="dl-panel">
            <div class="dl-panel-head">
              <div>
                <h2 class="dl-panel-title">最近核算批次</h2>
                <p class="dl-panel-sub">回看历史月份和最近导出状态。</p>
              </div>
            </div>
            <div id="recentBatchTable" class="dl-table-wrap"></div>
          </section>
        </section>

        <section class="dl-view" id="canbuBatchListView" data-view="canbuBatches" hidden>
          <div class="dl-panel">
            <div class="dl-panel-head">
              <div>
                <h2 class="dl-panel-title">餐补核算批次</h2>
                <p class="dl-panel-sub">一个批次对应一次可回看的餐补核算，同一月份可保留多次试算或复算。</p>
              </div>
              <div class="dl-actions-inline">
                <button class="dl-btn" id="btnBackHome" type="button">返回科目首页</button>
                <button class="btn-new-batch" id="btnNewCanbuBatch" type="button">新建餐补批次</button>
              </div>
            </div>
            <div id="canbuBatchTable" class="dl-table-wrap"></div>
          </div>
        </section>

        <section class="dl-view" id="canbuWorkbenchView" data-view="canbuWorkbench" hidden>
          <div id="canbuWorkbenchRoot"></div>
        </section>
      </main>
    </div>

    <!-- ═══ TOAST ═══ -->
    <div id="payrollToast" class="labor-toast" role="status" aria-live="polite"></div>
    <div class="dl-modal-backdrop" id="canbuBatchModal" role="dialog" aria-modal="true" aria-labelledby="canbuBatchModalTitle">
      <div class="dl-modal">
        <div class="dl-modal-head">
          <h2 class="dl-modal-title" id="canbuBatchModalTitle">新建餐补批次</h2>
          <p class="dl-modal-sub">选择本次餐补核算月份，创建后进入数据上传流程。</p>
        </div>
        <div class="dl-modal-body">
          <label class="dl-month-field">
            <span>核算月份</span>
            <input id="canbuBatchMonth" type="text" autocomplete="off" readonly />
          </label>
          <div class="dl-month-picker" aria-label="选择核算月份">
            <div class="dl-month-picker-head">
              <button class="dl-month-picker-nav" id="btnCanbuBatchPrevYear" type="button" aria-label="上一年">‹</button>
              <div class="dl-month-picker-year" id="canbuBatchYear">2026</div>
              <button class="dl-month-picker-nav" id="btnCanbuBatchNextYear" type="button" aria-label="下一年">›</button>
            </div>
            <div class="dl-month-picker-grid" id="canbuBatchMonthGrid" role="listbox" aria-label="选择月份"></div>
          </div>
        </div>
        <div class="dl-modal-foot">
          <button class="dl-btn" id="btnCancelCanbuBatch" type="button">取消</button>
          <button class="btn-primary" id="btnConfirmCanbuBatch" type="button">创建批次</button>
        </div>
      </div>
    </div>
    <aside id="explainDrawer" class="dl-explain-drawer" aria-label="员工核算说明">
      <div class="dl-drawer-head">
        <div>
          <p class="dl-eyebrow">Calculation explanation</p>
          <h2 class="dl-title" id="explainTitle">员工核算说明</h2>
        </div>
        <button class="btn-close-drawer" id="btnCloseExplain" type="button" aria-label="关闭解释抽屉">×</button>
      </div>
      <div class="dl-drawer-body" id="explainBody"></div>
    </aside>
    <div class="dl-modal-backdrop" id="calcModal" role="dialog" aria-modal="true" aria-labelledby="calcModalTitle">
      <div class="dl-modal dl-calc-modal">
        <div class="dl-modal-head">
          <h2 class="dl-modal-title" id="calcModalTitle">计算过程</h2>
          <p class="dl-modal-sub">展示本员工餐补的规则来源、关键输入和计算公式。</p>
        </div>
        <div class="dl-modal-body" id="calcModalBody"></div>
        <div class="dl-modal-foot">
          <button class="btn-primary" id="btnCloseCalcModal" type="button">关闭</button>
        </div>
      </div>
    </div>

    <script src="domestic-labor.js?v=1"></script>
  </body>
</html>
